<title>yumyumtumtum</title>
<meta name="theme-color" content="#E0431F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FAF7FB; --surface:#FFFFFF; --sunk:#F0EAF2; --line:#E4DBE8;
  --ink:#2A1B33; --ink-2:#5B4D66; --ink-3:#8A7D94;
  --chili:#E0431F; --chili-press:#C73816; --chili-soft:#FDE4DC;
  --saffron:#F2A91E; --saffron-soft:#FFF0CC;
  --basil:#23835A; --basil-soft:#DCF1E5;
  --berry:#C2386E; --berry-soft:#FBE1EC;
  --danger:#C22A1A;
  --nav-bg:rgba(255,255,255,.9);
  --scrim:rgba(28,16,36,.45);
  --shadow:0 1px 2px rgba(42,27,51,.06),0 8px 24px rgba(42,27,51,.08);
  --radius:16px;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#140D19; --surface:#1F1627; --sunk:#2A1F33; --line:#382B42;
    --ink:#F5EFF7; --ink-2:#C9BDD1; --ink-3:#978BA1;
    --chili:#E8502C; --chili-press:#F2633F; --chili-soft:#3B1D18;
    --saffron:#FFC24D; --saffron-soft:#35290F;
    --basil:#55C58F; --basil-soft:#15301F;
    --berry:#F06C9B; --berry-soft:#3A1727;
    --danger:#FF6B5E;
    --nav-bg:rgba(31,22,39,.9);
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#140D19; --surface:#1F1627; --sunk:#2A1F33; --line:#382B42;
  --ink:#F5EFF7; --ink-2:#C9BDD1; --ink-3:#978BA1;
  --chili:#E8502C; --chili-press:#F2633F; --chili-soft:#3B1D18;
  --saffron:#FFC24D; --saffron-soft:#35290F;
  --basil:#55C58F; --basil-soft:#15301F;
  --berry:#F06C9B; --berry-soft:#3A1727;
  --danger:#FF6B5E;
  --nav-bg:rgba(31,22,39,.9);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html.locked,html.locked body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:960px;margin-inline:auto;padding-inline:16px}
#view{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body[data-route="recipe"] #view{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
#view.enter{animation:rise .24s ease-out}
.muted{color:var(--ink-3);font-weight:600}

/* top bars */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding-block:10px}
.brandbar{display:flex;align-items:center;gap:10px;min-height:40px}
.logo{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:0 3px 10px rgba(224,67,31,.3);object-fit:cover}
.wordmark{font:800 22px/1 var(--display);letter-spacing:-.035em}
.wordmark .y{color:var(--chili)}
.title{font:800 30px/1.1 var(--display);letter-spacing:-.03em}
.title.sm{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.pagehead{display:flex;align-items:center;gap:12px;min-height:44px}
.ph-t{flex:1;min-width:0}
.ph-sub{color:var(--ink-3);font-size:13px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}

/* home */
.greet{font:800 clamp(26px,7.4vw,36px)/1.06 var(--display);letter-spacing:-.03em;margin-top:10px;text-wrap:balance}
.greet-sub{color:var(--ink-2);margin:4px 0 16px;font-size:16px}
.searchpill{display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);box-shadow:var(--shadow);font-weight:600}
.searchpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;padding-block:12px 2px}
.scroll-x{overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x::after{content:"";flex:0 0 1px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dashed{border-style:dashed;background:transparent}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font:700 20px/1.2 var(--display);letter-spacing:-.02em}
.link{color:var(--chili);font-weight:800;font-size:14px;flex:none}
.row{display:flex;gap:14px;padding-bottom:4px}
.row .card{flex:0 0 min(44vw,190px);scroll-snap-align:start}
.row .card.big{flex-basis:min(76vw,330px)}
.row .coltile{flex:0 0 min(40vw,170px);scroll-snap-align:start}
.cuis{position:relative;flex:0 0 122px;height:152px;border-radius:18px;overflow:hidden;text-align:left;scroll-snap-align:start;isolation:isolate;background:var(--sunk)}
.cuis .art svg{width:78%;right:-10%;bottom:auto;top:6%}
.cuis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cuis-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,20,0) 38%,rgba(20,10,20,.74))}
.cuis-t{position:absolute;left:12px;right:10px;bottom:11px;display:flex;flex-direction:column;color:#fff}
.cuis-t b{font:800 17px/1.1 var(--display);letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.cuis-t small{font-size:12px;font-weight:700;opacity:.9}
.cuis.none .art{filter:saturate(.75)}
.cuis.none .cuis-t small{opacity:.75}

/* cards */
.card{position:relative;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;border-radius:var(--radius)}
.media{position:relative;display:block;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--sunk);max-width:100%;isolation:isolate}
.card.big .media{aspect-ratio:4/3}
.media img,.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{position:absolute;inset:0;display:block;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.3),transparent 46%),linear-gradient(140deg,var(--a),var(--b))}
.art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1.2px,transparent 1.5px);background-size:14px 14px}
.art svg{position:absolute;right:-6%;bottom:-8%;width:70%;height:auto;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.94;transform:rotate(-8deg)}
.vbadge{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:rgba(20,12,26,.66);color:#fff;font-size:12px;font-weight:800;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vbadge .ic{width:12px;height:12px}
.ex{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.92);color:#2A1B33;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#2A1B33;box-shadow:0 2px 8px rgba(0,0,0,.16);z-index:2}
.heart .ic{width:19px;height:19px}
.heart.on{color:#E0431F}
.card-body{min-width:0}
.card-body h3{font:700 15px/1.25 var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.big .card-body h3{font:700 18px/1.2 var(--display);letter-spacing:-.01em}
.meta{margin-top:2px;color:var(--ink-3);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}

/* collections */
.coltile{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.mosaic{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:1/1;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.mosaic.one{grid-template-columns:1fr;grid-template-rows:1fr}
.mosaic.none{grid-template-columns:1fr;grid-template-rows:1fr;place-items:center;color:var(--ink-3);background:var(--sunk)}
.mosaic.none .ic{width:30px;height:30px}
.mosaic.dashed{border:2px dashed var(--line);background:transparent;color:var(--chili)}
.cell{position:relative;display:block;overflow:hidden;background:var(--sunk)}
.cell .art svg{width:84%}
.ct-name{font-weight:800;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-n{color:var(--ink-3);font-size:13px;font-weight:600;margin-top:-4px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.smartgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.smart{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.dot{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.dot .ic{width:21px;height:21px}
.t-chili{background:var(--chili-soft);color:var(--chili)}
.t-berry{background:var(--berry-soft);color:var(--berry)}
.t-saffron{background:var(--saffron-soft);color:var(--saffron)}
.t-basil{background:var(--basil-soft);color:var(--basil)}
.sm-t{min-width:0;display:flex;flex-direction:column}
.sm-t b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-t span{color:var(--ink-3);font-size:13px;font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--nav-bg);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
.tabs{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px;padding-inline:8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--ink-3);font-size:11px;font-weight:800;letter-spacing:.02em}
.tab.on{color:var(--chili)}
.addbtn{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--chili);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(224,67,31,.38);transform:translateY(-14px)}
.addbtn:active{background:var(--chili-press)}
.addbtn .ic{width:28px;height:28px;stroke-width:2.6}
body[data-route="recipe"] .tabbar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:13px;font-weight:800;font-size:15px;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn .ic{width:19px;height:19px}
.btn.primary{background:var(--chili);color:#fff}
.btn.primary:active{background:var(--chili-press)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.plain{color:var(--ink-2);padding-inline:8px}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.big{height:54px;font-size:16px;border-radius:15px}
.btn.wide{width:100%}
.btn.sq{width:58px;padding:0;flex:none}
.btn.made{background:var(--basil-soft);color:var(--basil)}
.linkbtn{color:var(--chili);font-weight:800;text-decoration:underline;text-underline-offset:2px}

/* search */
.searchbox{display:flex;align-items:center;gap:10px;height:48px;padding:0 4px 0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:10px;color:var(--ink-3)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;height:100%;font-size:16px;color:var(--ink);outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.clear{width:40px;height:40px;display:grid;place-items:center;color:var(--ink-3)}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 12px;color:var(--ink-3);font-size:14px;font-weight:700}
.sortbtn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:800}
.sortbtn .ic{width:17px;height:17px}

/* recipe */
.hero{position:relative;max-width:960px;margin-inline:auto}
.hero .media{aspect-ratio:4/3;width:100%;max-height:min(56vh,560px);border-radius:0}
.hero .media .art svg{width:52%;right:4%;bottom:-4%}
@media (min-width:720px){.hero{padding:16px 16px 0}.hero .media{border-radius:24px}}
.hero-bar{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;padding:12px 16px}
@media (min-width:720px){.hero-bar{padding:28px 30px}}
.sp{flex:1}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#2A1B33;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.circ.on{color:#E0431F}
.dbody{padding-top:18px;max-width:720px}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-weight:700;font-size:14px}
.pchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 9px;border-radius:999px;background:var(--sunk);color:var(--ink);font-size:12.5px;font-weight:800;letter-spacing:.02em}
.pchip .ic{width:14px;height:14px}
.src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dtitle{font:800 clamp(28px,7.6vw,42px)/1.04 var(--display);letter-spacing:-.035em;margin:10px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.exnote{margin:-2px 0 14px;padding:10px 12px;border-radius:12px;background:var(--saffron-soft);color:var(--ink);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.stat{padding:12px 4px;text-align:center;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat b{display:block;font:800 18px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.rate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.lbl2{font-weight:800;color:var(--ink-2);font-size:14px}
.stars{display:flex}
.star{width:40px;height:44px;display:grid;place-items:center;color:var(--line)}
.star .ic{width:27px;height:27px}
.star.on{color:var(--saffron)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.block{margin-top:26px}
.block h2{font:700 19px/1.2 var(--display);letter-spacing:-.015em;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.block h2 .muted{font:700 14px var(--body)}
.ing{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ing input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;margin:1px 0 0;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.ing input:checked{background:var(--basil);border-color:var(--basil)}
.ing input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.ing input:checked+span{text-decoration:line-through;color:var(--ink-3)}
.notes{white-space:pre-wrap;padding:14px;border-radius:14px;background:var(--saffron-soft)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--ink-2);font-weight:700}
.addrow .ic{color:var(--chili)}
.saved{margin-top:28px;color:var(--ink-3);font-size:13px;font-weight:600}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.cta-in{max-width:720px;margin-inline:auto;display:flex;gap:10px}
.cta-in .btn.primary{flex:1;min-width:0;justify-content:space-between;height:58px;padding:0 18px}
.cta-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.cta-t small{font-size:12px;font-weight:700;opacity:.88}
.cta-t b{font-size:17px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta-in .btn.sq{height:58px}
.block{scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
.byline{margin:-6px 0 12px;color:var(--ink-2);font-weight:700;font-size:14px}
.desc{color:var(--ink-2);margin:-4px 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{-webkit-line-clamp:unset;display:block}
.subtimes{margin-top:8px;color:var(--ink-3);font-size:13px;font-weight:700;text-align:center}
.getcard{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 14px 14px 16px;border-radius:16px;background:var(--chili-soft)}
.getcard div{flex:1;min-width:0;display:flex;flex-direction:column}
.getcard b{font-weight:800}
.getcard span{font-size:13px;color:var(--ink-2)}
.jumps{display:flex;gap:8px;padding-block:18px 0}
.jumps .chip{height:34px;font-size:13px}
.ing .ihead,.steps .shead{list-style:none;padding:16px 2px 6px;font:800 12.5px/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--chili)}
.ing .ihead{border-bottom:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps .shead{padding:10px 2px 0}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.step .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 14px/1 var(--display);font-variant-numeric:tabular-nums}
.step p{margin:0;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.step.done{opacity:.55}
.step.done .num{background:var(--basil);color:#fff}
.step.done p{text-decoration:line-through}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

/* ---------- platforms + link detection ---------- */
const PLAT = {
  web:{name:'Website', ic:'globe'},
  tiktok:{name:'TikTok', ic:'play', video:true},
  instagram:{name:'Instagram', ic:'camera', video:true},
  youtube:{name:'YouTube', ic:'play', video:true},
  facebook:{name:'Facebook', ic:'play', video:true},
  pinterest:{name:'Pinterest', ic:'pin'},
  x:{name:'X', ic:'globe'},
  none:{name:'My recipe', ic:'edit'}
};
const plat = r => PLAT[r.platform] || PLAT.web;
const isVideo = r => !!plat(r).video;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
function cutNote(r){
  const name = (PLAT[r.platform] || {}).name || 'The site';
  return '<p class="cutnote">' + esc(name) + ' only shared the start of this caption, so some of the recipe may be missing. Tap <b>View on ' + esc(name) + '</b> below to see the rest.</p>';
}
function ctaParts(r){
  switch (r.platform) {
    case 'web': return [r.anchor ? 'Jump to the recipe on' : 'Open the original on', (r.siteName && r.siteName.length < 28) ? r.siteName : (hostOf(r.url) || 'the website')];
    case 'tiktok': return ['Watch on', 'TikTok'];
    case 'youtube': return ['Watch on', 'YouTube'];
    case 'instagram': return ['View on', 'Instagram'];
    case 'facebook': return ['View on', 'Facebook'];
    case 'pinterest': return ['View on', 'Pinterest'];
    case 'x': return ['View on', 'X'];
    default: return ['Open', 'the link'];
  }
}
const SMALL = new Set(['a','an','and','or','the','of','with','in','on','for','to','at','by','de','la','con','y']);
function slugTitle(pathname){
  const segs = pathname.split('/').filter(Boolean);
  for (let i = segs.length - 1; i >= 0; i--) {
    let s; try { s = decodeURIComponent(segs[i]); } catch (e) { s = segs[i]; }
    s = s.replace(/\.(html?|php|aspx?)$/i, '');
    if (!/[-_]/.test(s) || !/[a-z]{3}/i.test(s)) continue;
    const w = s.split(/[-_]+/).filter(x => x && !/^\d+$/.test(x));
    while (w.length > 1 && /^recipes?$/i.test(w[w.length - 1])) w.pop();
    if (w.length < 2) continue;
    return w.map((x, j) => (j && SMALL.has(x.toLowerCase())) ? x.toLowerCase() : x.charAt(0).toUpperCase() + x.slice(1).toLowerCase()).join(' ').slice(0, 120);
  }
  return '';
}
function detect(raw){
  const t = String(raw || '').trim();
  if (!t) return null;
  let u;
  try { u = new URL(t); } catch (e) { try { u = new URL('https://' + t); } catch (e2) { return null; } }
  if (!/^https?:$/.test(u.protocol) || !/\.[a-z]{2,}$/i.test(u.hostname)) return null;
  const host = u.hostname.toLowerCase().replace(/^(www|m|mobile|vm|vt)\./, '');
  const path = u.pathname;
  let platform = 'web', source = host, ytId = null, m;
  if (/(^|\.)tiktok\.com$/.test(host)) { platform = 'tiktok'; m = path.match(/\/@([^/]+)/); source = m ? '@' + m[1] : 'TikTok'; }
  else if (/(^|\.)instagram\.com$/.test(host)) { platform = 'instagram'; m = path.match(/^\/([^/]+)\/?$/); source = (m && ['p','reel','reels','explore','tv','stories'].indexOf(m[1]) < 0) ? '@' + m[1] : 'Instagram'; }
  else if (host === 'youtu.be' || /(^|\.)youtube\.com$/.test(host)) {
    platform = 'youtube'; source = 'YouTube';
    ytId = host === 'youtu.be' ? path.slice(1).split('/')[0] : (u.searchParams.get('v') || ((path.match(/\/(shorts|embed|live)\/([\w-]{6,})/) || [])[2]) || null);
    m = path.match(/\/@([^/]+)/); if (m) source = '@' + m[1];
  }
  else if (/(^|\.)facebook\.com$/.test(host) || host === 'fb.watch') { platform = 'facebook'; source = 'Facebook'; }
  else if (/(^|\.)pinterest\.[a-z.]+$/.test(host) || host === 'pin.it') { platform = 'pinterest'; source = 'Pinterest'; }
  else if (host === 'x.com' || host === 'twitter.com') { platform = 'x'; m = path.match(/^\/([^/]+)/); source = m ? '@' + m[1] : 'X'; }
  return { url: u.href, host: host, platform: platform, source: source, ytId: (ytId && /^[\w-]{6,}$/.test(ytId)) ? ytId : null, title: platform === 'web' ? slugTitle(path) : '' };
}
function normUrl(s){
  try {
    const x = new URL(s); x.hash = '';
    Array.from(x.searchParams.keys()).forEach(k => { if (/^(utm_|fbclid|igsh|igshid|si$|is_from_webapp|sender_device|_r$|_t$|feature$)/i.test(k)) x.searchParams.delete(k); });
    return (x.hostname.replace(/^(www|m)\./, '') + x.pathname.replace(/\/$/, '') + x.search).toLowerCase();
  } catch (e) { return String(s).trim().toLowerCase(); }
}

function timeShort(m){ m = Math.round(+m); if (!m) return '—'; if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return r ? h + 'h ' + r + 'm' : h + ' hr'; }
function fmtDate(iso){ const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function greeting(){ const h = new Date().getHours(); const part = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; const n = (Store.settings.name || '').trim(); return n ? part + ', ' + n : part; }

let bootDone; const bootP = new Promise(r => { bootDone = r; });
const queue = new Map();
function persist(coll, id, body){
  if (Store.mode === 'starting') { bootP.then(() => persist(coll, id, body)); return; }
  if (Store.mode === 'local') {
    if (Store.local !== 'idb') { saveSoon(LOCAL_KEY); return; }
    const p = body ? (coll === 'meta' ? IDB.put('meta', clone(body), id) : IDB.put(coll, clone(body))) : IDB.del(coll, id);
    p.catch(() => toast("Couldn't save that change on this phone. Try again."));

  }

}
function enqueue(path, fn){
  let s = queue.get(path);

}
async function runQ(path, s, fn){

  if (s.next) { const n = s.next; s.next = null; runQ(path, s, n); } else queue.delete(path);
}

const SEARCH_DEFAULT = () => ({q:'', kind:'', time:0, status:'', cuisine:'', meals:[], plats:[], sort:'new'});

const SORTS = {new:'Newest first', old:'Oldest first', az:'A to Z', quick:'Quickest', rating:'Highest rated', made:'Most made'};
function sorted(arr, key){
  const a = arr.slice(); const t = r => Date.parse(r.createdAt) || 0;
  switch (key) {
    case 'old': return a.sort((x, y) => t(x) - t(y));
    case 'az': return a.sort((x, y) => (x.title || '').localeCompare(y.title || ''));
    case 'quick': return a.sort((x, y) => (x.time || 1e9) - (y.time || 1e9));
    case 'rating': return a.sort((x, y) => (y.rating || 0) - (x.rating || 0) || t(y) - t(x));
    case 'made': return a.sort((x, y) => (y.madeCount || 0) - (x.madeCount || 0) || t(y) - t(x));
    default: return a.sort((x, y) => t(y) - t(x));
  }
}
function hay(r){
  return [r.title, r.source, r.cuisine || guessCuisine(r), r.notes, plat(r).name].concat(r.tags || [], r.meal || [], r.ingredients || [], (r.collections || []).map(id => (Store.cols.get(id) || {}).name)).filter(Boolean).join(' \n ').toLowerCase();
}
function filterList(){

    if (S.status === 'try' && r.madeCount) return false;

}

/* ---------- navigation ---------- */
const TABS = ['home', 'search', 'yums', 'me'];
let stack = [{name:'home'}];
let pushed = 0;
const cur = () => stack[stack.length - 1];
function go(route){
  const c = cur(); c.scroll = window.scrollY;
  if (!$('#sheet').hidden) closeSheet();
  if (TABS.indexOf(route.name) >= 0) stack = [route];
  else {
    if (c.name === route.name && c.id === route.id) return;
    stack.push(route);
    try { history.pushState({yyt:stack.length}, ''); pushed++; } catch (e) {}
  }
  show(true);
}
function back(){
  if (stack.length <= 1) { go({name:'home'}); return; }
  if (pushed > 0) { try { history.back(); return; } catch (e) {} }
  popRoute();
}
function popRoute(){ if (stack.length > 1) { stack.pop(); show(false); } }
window.addEventListener('popstate', () => { if (pushed > 0) pushed--; if (!$('#modal').hidden) closeModal(false); if (!$('#sheet').hidden) closeSheet(); popRoute(); });

function show(forward){
  const r = cur();
  document.body.setAttribute('data-route', r.name);
  const v = $('#view');
  v.innerHTML = (V[r.name] || V.home)(r);
  mountView(r);
  updateNav();
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  window.scrollTo(0, forward ? 0 : (r.scroll || 0));
}
function mountView(r){
  if (r.name === 'discover') { mountDiscover(r); return; }
  if (r.name === 'cook') { mountCook(r); return; }
  if (r.name === 'cat') { loadFeed('k:' + r.key); return; }
  if (r.name !== 'search') return;
  const q = $('#q');
  q.value = S.q;
  q.addEventListener('input', () => { S.q = q.value; renderResults(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
  renderResults();
  if (r.focus) { r.focus = false; setTimeout(() => q.focus(), 80); }
}
let rq = 0;
function refresh(){
  if (rq) return;
  rq = requestAnimationFrame(() => {
    rq = 0;
    const r = cur();
    if (r.name === 'search' && $('#results')) renderResults();
    else if (!(document.activeElement && ['myname', 'dq', 'pq', 'neverin'].indexOf(document.activeElement.id) >= 0)) {
      const y = window.scrollY; const sx = {};
      $$('[data-sx]').forEach(el => { sx[el.dataset.sx] = el.scrollLeft; });
      $('#view').innerHTML = (V[r.name] || V.home)(r);
      mountView(r);
      $$('[data-sx]').forEach(el => { if (sx[el.dataset.sx]) el.scrollLeft = sx[el.dataset.sx]; });
      window.scrollTo(0, y);
    }
    updateNav();
    if (sheetRefresh) sheetRefresh();

}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

function rankItems(items, P, opts){

  const hide = new Set(tasteStore().hide);
  const qWords = opts.q ? opts.q.toLowerCase().split(/\s+/).filter(x => x.length > 2).map(x => x.length > 4 ? x.replace(/(es|s)$/, '') : x) : [];
  const scored = [];
  items.forEach(it => {
    const k = normUrl(it.url);
    if (saved.has(k) || hide.has(k) || !it.title || neverHit(it.title)) return;
    const low = it.title.toLowerCase();
    const terms = termsOf(it.title);
    const cu = guessCuisine({title:it.title});
    if (cu) terms.push('cuisine:' + cu.toLowerCase());
    let s = 0;
    terms.forEach(t => { s += (P.w[t] || 0) * (t.indexOf('cuisine:') === 0 ? 0.8 : 1); });
    // the reason names the most specific thing you like about it: a dish or cuisine before a plain ingredient
    const rankOf = t => t.indexOf('cuisine:') === 0 ? 3 : TERM_KIND[t] === 'd' ? 4 : TERM_KIND[t] === 'p' ? 1 : 2;
    let best = '', bv = 0;
    terms.filter(t => (P.w[t] || 0) >= 1).forEach(t => { if (!best || rankOf(t) > rankOf(best) || (rankOf(t) === rankOf(best) && P.w[t] > P.w[best])) best = t; });
    if (best) bv = P.w[best];
    s += (P.w['site:' + hostOf(it.url)] || 0) * 0.3;
    if (qWords.length) { const m = qWords.filter(x => low.indexOf(x) >= 0).length; s += m * 40 + (m === qWords.length ? 60 : 0); }
    s += Math.min(it.hits || 0, 3) * 0.5;
    if (!it.image) s -= 2;
    s += dayJitter(it.url);
    // why: short, for cards. whyLong: for the preview
    let why = '', whyLong = '';
    if (bv >= 1) {
      const ex = P.ex[best];
      if (best.indexOf('cuisine:') === 0) { why = 'More ' + cap1(best.slice(8)); whyLong = why + (ex ? ', like your ' + ex : ''); }
      else if (TERM_KIND[best] === 'p') { why = 'You like ' + best; whyLong = 'You save a lot of ' + best + ' recipes'; }
      else if (ex) { why = 'Like your ' + shortT(ex); whyLong = 'Because you saved ' + ex; }
      else { why = 'You like ' + best; whyLong = why; }
    } else if (opts.seasonal && it.q === opts.seasonal) { why = 'Good for ' + opts.season; whyLong = 'Something new for ' + opts.season; }
    scored.push({it:it, s:s, terms:terms, why:why, whyLong:whyLong, key:low.replace(/[^a-z0-9]+/g, ' ').trim()});
  });

  while (scored.length && out.length < 240) {
    let bi = 0, bs = -1e9;
    for (let i = 0; i < Math.min(scored.length, 40); i++) {
      const x = scored[i];
      let pen = (perSrc[x.it.source] || 0) * 0.9 + (names.has(x.key) ? 3 : 0);
      x.terms.forEach(t => { pen += (perTerm[t] || 0) * 0.18 * Math.max(1, Math.min(P.w[t] || 0, 8)); });

    }
    const x = scored.splice(bi, 1)[0];
    out.push(Object.assign({}, x.it, {why:x.why, whyLong:x.whyLong}));
    perSrc[x.it.source] = (perSrc[x.it.source] || 0) + 1;
    x.terms.forEach(t => { perTerm[t] = (perTerm[t] || 0) + 1; });
    names.add(x.key);
  }
  return out;
}

const CAT_TIP = {desserts:'Desserts need things like chocolate, fruit, cream cheese, or milk. Add what you have of those.', baking:'Add baking things you have, like chocolate chips, bananas, milk, or baking powder.',
  bread:'Add yeast, milk, or baking powder if you have them.', drinks:'Add fruit, milk, or juice you have.', breakfast:'Add eggs, bacon, sausage, or bread if you have them.',

// fewest real ingredients missing first, then fewest spices, then what you'd like, then what uses more of your kitchen
const byMatch = (a, b) => (a.m.missing.length - b.m.missing.length) || (a.m.spices.length - b.m.spices.length) || (b.s - a.s) || (b.m.have - a.m.have);
const inCat = (cats, cat) => !cat || cats.indexOf(cat) >= 0;
function savedMatches(cat){
  const P = tasteProfile();
  const all = list().filter(r => !r.sample);
  const withList = all.filter(r => countItems(r.ingredients) >= 2);
  const rows = withList.filter(r => inCat(catsOf(r), cat))
    .map(r => ({r:r, m:kitchenMatch(r), s:tasteOf(r.title, P) + (r.fav ? 2 : 0) + Math.min(r.madeCount || 0, 3) * 0.7 + Math.max(0, (r.rating || 0) - 3)}))
    .filter(x => x.m.uses.length && x.m.need).sort(byMatch);
  return {rows:rows, noList:all.length - withList.length};
}
function webMatches(cat){
  if (!COOK.items) return [];
  const P = tasteProfile();
  const saved = new Set(list().map(r => r.url ? normUrl(r.url) : '').filter(Boolean));
  const hide = new Set(tasteStore().hide);
  return COOK.items.filter(it => { const k = normUrl(it.url); return !hide.has(k) && (!saved.has(k) || DISC.savedNow.has(k)) && !neverHit(it.title, it.ingredients); })
    .filter(it => { const c = catsOf(it); return inCat(c, cat) || (cat && !c.length); })
    .map(it => ({it:it, m:kitchenMatch(it), s:tasteOf(it.title, P)}))
    .filter(x => x.m.uses.length && x.m.need >= 2).sort(byMatch);
}

function drawSug(v){
  const box = $('#psug'); if (!box) return;
  const t = normFood(v); if (t.length < 2) { box.innerHTML = ''; return; }
  const p = pantryStore(); const has = new Set(p.items.map(x => x.id).concat(p.basics));
  const out = foodsIn(v).filter(id => !has.has(id));
  // names that start with what you typed first, shortest first ("chick" -> Chicken before Chicken broth)
  const last = normFood(String(v).split(',').pop());
  if (last.length >= 2) FOODS.map(f => { const lab = f[1].toLowerCase(); return {id:f[0], lab:lab, r:lab.indexOf(last) === 0 ? 0 : lab.split(/\s+/).some(w => w.indexOf(last) === 0) ? 1 : 9}; })
    .filter(x => x.r < 9 && !has.has(x.id) && out.indexOf(x.id) < 0).sort((a, b) => a.r - b.r || a.lab.length - b.lab.length)
    .forEach(x => { if (out.length < 8) out.push(x.id); });
  box.innerHTML = out.slice(0, 8).map(id => '<button type="button" class="chip dashed" data-psug="' + esc(id) + '">' + icon('plus') + esc(LABEL[id]) + '</button>').join('');

const CAT_Q = {main:['easy dinner', 'dinner'], sides:['side dish', 'easy side dish'], apps:['appetizer', 'dip'], soups:['soup', 'stew'], salads:['salad'],
  breakfast:['breakfast', 'brunch'], desserts:['dessert', 'cookies'], baking:['cookies', 'muffins', 'cake'], bread:['bread', 'rolls', 'biscuits'], drinks:['drinks', 'smoothie', 'agua fresca']};

function catFeedQueries(k, P){
  const top = kind => Object.keys(P.w).filter(t => TERM_KIND[t] === kind && P.w[t] >= 1 && !neverHit(t)).sort((a, b) => P.w[b] - P.w[a]);
  const q = (CAT_Q[k] || [k]).slice();
  const prot = top('p')[0], dish = top('d')[0];
  const word = {main:'dinner', soups:'soup', salads:'salad', apps:'appetizer', sides:'side dish'}[k];
  if (prot && word) q.unshift(prot + ' ' + word);
  if (k === 'main' && dish) q.unshift(dish);
  return q.filter((x, i, a) => a.indexOf(x) === i).slice(0, 4);
}

  [/^((the|full|my)\s+)?recipe(\s+(below|here|details|breakdown))?$/i, 'recipe'],
  [/^for the [\p{L}\s]+$/iu, 'ingsub'],
  [/^((quick|easy|simple|full|the|recipe|cooking)\s+)?(instructions?|directions?|method|steps?|how to( make)?( it| them| this)?|how i made (it|this|them)|how i make (it|this|them)|preparation|to make)$/i, 'step'],
  [/^(notes?|tips?|pro tips?|chef(’|')?s tips?|substitutions?|swaps?|variations?|storage|to store|leftovers|recipe notes|make ahead)$/i, 'note'],
  [/^(equipment|cookware|tools|you(’|')?ll also need)$/i, 'equip'],

];
const QTY = /^([\d½¼¾⅓⅔⅛⅜⅝⅞]|a (cup|pinch|dash|handful|few|couple)|an? \d|one |two |three |pinch|dash|handful|salt|pepper)/i;

// where a new ingredient starts inside a run-together list: "…butter 1 onion 3 carrots…"

  const all = [pre.url, pre.text, pre.title].filter(Boolean).join(' ');
  const m = all.match(/https?:\/\/[^\s]+/i);
  if (!m) { if (all.trim()) { $('#f-title').value = all.trim().slice(0, 120); F.titleAuto = false; } return; }
  $('#f-url').value = m[0];
  onUrlInput();
  const tidy = s => String(s || '').replace(m[0], ' ').replace(/https?:\/\/[^\s]+/gi, ' ').replace(/#[\p{L}\p{N}_]+/gu, ' ').replace(/\s+/g, ' ').replace(/^[\s\-|:·•]+|[\s\-|:·•]+$/g, '').trim();
  const t = tidy(pre.title).length > 3 ? tidy(pre.title) : tidy(pre.text);
  if (t.length > 3) { $('#f-title').value = t.slice(0, 120); F.fromShare = true; }
  if (!$('#f-title').value.trim()) setTimeout(() => { const el = $('#f-title'); if (el) el.focus(); }, 320);
}
function onUrlInput(){
  const el = $('#f-url'); let v = el.value;
  const m = v.match(/https?:\/\/[^\s]+/i);
  if (m && v.trim() !== m[0]) {
    const rest = v.replace(m[0], ' ').replace(/#[\p{L}\p{N}_]+/gu, ' ').replace(/\s+/g, ' ').trim();
    el.value = m[0]; v = m[0];
    if (rest.length > 3 && F.titleAuto) { $('#f-title').value = rest.slice(0, 120); F.fromShare = true; }
  }
  F.url = v.trim(); F.det = F.url ? detect(F.url) : null;
  const d = F.det;
  if (F.titleAuto && !F.fromShare) $('#f-title').value = d ? (d.title || '') : '';
  if (F.photoUrl && /i\.ytimg\.com/.test(F.photoUrl) && !(d && d.ytId)) F.photoUrl = null;
  if (d && d.ytId && !F.photoId && !F.photoData) F.photoUrl = 'https://i.ytimg.com/vi/' + d.ytId + '/hqdefault.jpg';
  renderDet(); renderPrev();
  scheduleRead();
}
function scheduleRead(){
  if (!F) return;
  clearTimeout(F.readT);
  if (!canRead() || !F.det) return;
  const url = F.det.url;
  if (normUrl(url) === normUrl(F.lastReadUrl || '')) return;
  F.readT = setTimeout(() => startRead(url), 450);
}
async function startRead(url){
  const f = F; if (!f) return;
  f.lastReadUrl = url; f.readState = 'reading'; f.imp = null; renderDet();
  let j;
  try { j = await readLink(url); }
  catch (e) {
    if (F === f && normUrl(f.lastReadUrl) === normUrl(url)) { f.readState = 'failed'; f.readMsg = e.message; renderDet(); }
    return;
  }
  if (normUrl(f.lastReadUrl) !== normUrl(url)) return;
  if (f.closed) { if (f.saved && f.savedId) enrichRecipe(f.savedId, j); return; }
  f.imp = j; f.readState = 'done';
  fillFormFromImport(j);
  renderDet();
  if (j.image && !f.photoKey && !f.photoId && !f.photoData && !(f.photoUrl && !/i\.ytimg\.com/.test(f.photoUrl))) {
    f.photoFetching = true; renderPrev();
    let ph = null;
    try { ph = await savePhotoFromUrl(j.image); } catch (e) {}
    f.photoFetching = false;
    if (!ph) { if (F === f) renderPrev(); return; }
    if (!f.closed) {
      if (!f.photoKey && !f.photoId && !f.photoData) { Object.assign(f, ph); if (ph.photoKey) { f.uploadedLocal.push(ph.photoKey); f.preview = PHOTO_URLS.get(ph.photoKey); } renderPrev(); renderDet(); }
      else if (ph.photoKey) delPhotoKey(ph.photoKey);
    } else if (f.saved && f.savedId) {
      const r = Store.recipes.get(f.savedId);
      if (r && !hasOwnPhoto(r)) putRecipe(Object.assign({}, r, ph)); else if (ph.photoKey) delPhotoKey(ph.photoKey);
    } else if (ph.photoKey) delPhotoKey(ph.photoKey);
  }
}
function fillFormFromImport(j){
  const set = (sel, v) => { const el = $(sel); if (el && !el.value.trim() && v) el.value = v; };
  const t = $('#f-title');
  if (j.title && (F.titleAuto || (F.fromShare && j.kind === 'recipe') || !t.value.trim())) { t.value = j.title.slice(0, 140); F.titleAuto = false; F.fromShare = true; }
  set('#f-time', j.totalTime || ''); set('#f-serv', j.servings || ''); set('#f-cuisine', j.cuisine || '');
  set('#f-ing', (j.ingredients || []).join('\n')); set('#f-steps', (j.steps || []).join('\n'));
  set('#f-srcnotes', (j.notes || []).join('\n')); set('#f-equip', (j.equipment || []).join('\n'));
  if (!F.meal.size && (j.meals || []).length) { j.meals.forEach(m => F.meal.add(m)); renderFMeals(); renderPrev(); }
}
function renderDet(){
  const box = $('#f-det'); if (!box || !F) return;
  const d = F.det;
  if (!F.url) { box.innerHTML = '<p class="hint">Works with TikTok, Instagram, YouTube, Facebook, Pinterest, and any recipe website. No link? Just fill in the name.</p>'; return; }
  if (!d) { box.innerHTML = '<p class="hint bad">That doesn\'t look like a link yet.</p>'; return; }
  const p = PLAT[d.platform];
  const extra = d.platform === 'web' ? d.host : (d.source && d.source !== p.name ? d.source : '');
  const dup = list().find(x => x.id !== F.id && x.url && normUrl(x.url) === normUrl(d.url));
  let st = '';
  if (F.readState === 'reading') st = '<p class="readst"><span class="spin sm"></span>Reading the recipe from ' + esc(extra || p.name) + '…</p>';
  else if (F.readState === 'done' && F.imp) {
    const parts = foundList({ingredients:F.imp.ingredients, steps:F.imp.steps, srcNotes:F.imp.notes, equipment:F.imp.equipment}, !!F.photoKey && F.uploadedLocal.indexOf(F.photoKey) >= 0);
    st = parts.length ? '<p class="readst ok">' + icon('check') + 'Got ' + esc(joinList(parts)) + (F.imp.via === 'archive' ? ' (from a saved copy of the page)' : '') + '</p>'
      : (F.imp.caption ? '<p class="readst">Got the caption, but no ingredient list in it. The full caption is saved with the recipe so you can read it.</p>' : '<p class="readst">No recipe card on that page. Add the details below, or use Paste recipe text.</p>');
  }
  if (F.readState === 'done' && F.imp && F.imp.captionCut) st += '<p class="readst">' + esc(p.name) + ' only shared the start of the caption, so some of the recipe may be missing.</p>';
  if (F.readState === 'failed') st = '<p class="readst bad">' + esc(F.readMsg) + ' You can still save it, or use Paste recipe text. <button type="button" class="linkbtn sm" data-act="f-reread">Try again</button></p>';
  box.innerHTML = '<p class="detect">' + icon(p.ic) + '<span>' + esc(p.name) + (extra ? ' · ' + esc(extra) : '') + '</span></p>' + st
    + (dup ? '<div class="warn">You already saved this one: <button type="button" class="linkbtn" data-open="' + esc(dup.id) + '">' + esc(dup.title) + '</button></div>' : '');
}
const fSrc = () => F.preview || (F.photoKey ? PHOTO_URLS.get(F.photoKey) : null) || (F.photoId ? '/_blob/' + F.photoId : null) || F.photoData || F.photoUrl;

  const box = $('#f-prev'); if (!box || !F) return;

function renderFMeals(){ const b = $('#f-meals'); if (b) b.innerHTML = MEALS.map(m => '<button type="button" class="chip' + (F.meal.has(m) ? ' on' : '') + '" data-fm="' + m + '" aria-pressed="' + F.meal.has(m) + '">' + m + '</button>').join(''); }
function renderTags(){ const b = $('#f-tags'); if (b) b.innerHTML = F.tags.map((t, i) => '<button type="button" class="tagchip" data-rmtag="' + i + '" aria-label="Remove tag ' + esc(t) + '">#' + esc(t) + icon('x') + '</button>').join(''); }
function renderFCols(){

  b.innerHTML = customCols().map(c => '<button type="button" class="chip' + (F.cols.has(c.id) ? ' on' : '') + '" data-fc="' + esc(c.id) + '" aria-pressed="' + F.cols.has(c.id) + '">' + esc(c.name) + '</button>').join('')
    + '<button type="button" class="chip dashed" data-act="f-newcol">' + icon('plus') + 'New</button>';
  $('#f-ncrow').hidden = !F.showNew;
}
function addTag(){ const el = $('#f-tag'); if (!el || !F) return; const v = el.value.replace(/[#,]/g, '').trim().toLowerCase(); if (v && F.tags.indexOf(v) < 0 && F.tags.length < 20) { F.tags.push(v); renderTags(); } el.value = ''; }
function fAddCol(){ const el = $('#f-newcol'); const name = el.value.trim(); if (!name) { el.focus(); return; } const c = newCol(name); F.cols.add(c.id); el.value = ''; F.showNew = false; renderFCols(); }
async function handlePhoto(file){
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(file.name || '')) { toast("That file isn't a photo."); return; }
  const f = F; f.busy = true; renderPrev();
  try {
    if (Store.mode === 'cloud' && Store.assets) {
      const blob = await compress(file, 1400, 0.82);
      const up = await Store.assets.upload(blob, {type:'image/jpeg'});
      if (f.closed) { deleteAsset(up.id); return; }
      f.uploaded.push(up.id); f.photoId = up.id; f.preview = up.url; f.photoKey = null; f.photoData = null; f.photoUrl = null;
    } else if (onPhone()) {
      const blob = await compress(file, 1400, 0.82);
      const key = 'p-' + uid();
      await IDB.put('photos', blob, key);
      if (f.closed) { delPhotoKey(key); return; }
      const u = URL.createObjectURL(blob); PHOTO_URLS.set(key, u);
      f.uploadedLocal.push(key); f.photoKey = key; f.preview = u; f.photoId = null; f.photoData = null; f.photoUrl = null;
    } else {
      const blob = await compress(file, 720, 0.72);
      const d = await blobToDataURL(blob);
      if (f.closed) return;
      f.photoData = d; f.photoId = null; f.photoKey = null; f.preview = null; f.photoUrl = null;
    }
  } catch (e) {
    toast(e && e.code === 'too_large' ? 'That photo is too big. Try a smaller one.' : "Couldn't add that photo. Try a screenshot instead.");
  } finally {
    f.busy = false; if (F === f) renderPrev();
  }
}
function saveEditor(){
  if (!F) return;
  if (F.busy) { toast('One sec, the photo is still uploading.'); return; }
  clearTimeout(F.readT);
  if (canRead() && F.det && F.readState !== 'reading' && normUrl(F.det.url) !== normUrl(F.lastReadUrl || '')) startRead(F.det.url);
  addTag();
  const d = F.det;
  if (F.url && !d) { toast('Fix the link, or clear it to save without one.'); $('#f-url').focus(); return; }
  let title = $('#f-title').value.trim();
  if (!title && d) title = d.title || (d.platform === 'web' ? d.host : PLAT[d.platform].name + ' recipe');
  if (!title) { $('#f-title').classList.add('err'); $('#f-title').focus(); toast('Give it a name or paste a link.'); return; }
  const base = F.id ? Store.recipes.get(F.id) : null;
  const num = (v, max) => { const n = Math.round(parseFloat(v)); return n > 0 ? Math.min(n, max) : 0; };
  const keepSource = base && base.url && d && normUrl(base.url) === normUrl(d.url) && base.source;
  const r = Object.assign({}, base || {}, {
    id: F.id || uid(),
    title: title.slice(0, 140),
    url: d ? d.url : '',
    platform: d ? d.platform : 'none',
    source: d ? (keepSource ? base.source : d.source) : '',
    meal: Array.from(F.meal),
    time: num($('#f-time').value, 10000),
    servings: num($('#f-serv').value, 500),
    cuisine: $('#f-cuisine').value.trim().slice(0, 40),
    tags: F.tags.slice(),
    collections: Array.from(F.cols).filter(id => Store.cols.has(id)),
    ingredients: $('#f-ing').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 200),
    steps: $('#f-steps').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 150),
    srcNotes: $('#f-srcnotes').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 60),
    equipment: $('#f-equip').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 40),
    notes: $('#f-notes').value.trim().slice(0, 4000),
    photoId: F.photoId || null, photoKey: F.photoKey || null, photoData: F.photoData || null, photoUrl: F.photoUrl || null,
    rating: base ? (base.rating || 0) : 0, fav: base ? !!base.fav : false, madeCount: base ? (base.madeCount || 0) : 0,
    createdAt: base ? base.createdAt : now(),
    sample: false
  });
  // details that came with the link (byline, nutrition, jump spot) stay with that link
  const sameLink = base && base.url && d && normUrl(base.url) === normUrl(d.url);
  if (!sameLink) ['description', 'author', 'siteName', 'anchor', 'caption', 'captionCut', 'recipeUrl', 'nutrition', 'prepTime', 'cookTime', 'yieldText', 'importedAt', 'impSig'].forEach(k => { delete r[k]; });
  if (F.imp && d && normUrl(F.lastReadUrl || '') === normUrl(d.url)) {
    const j = F.imp;
    ['description', 'author', 'siteName', 'anchor', 'caption', 'recipeUrl', 'yieldText'].forEach(k => { if (j[k] && !r[k]) r[k] = j[k]; });
    r.captionCut = !!j.captionCut;
    r.impSig = listSig(j.ingredients, j.steps);
    if ((j.nutrition || []).length && !(r.nutrition || []).length) r.nutrition = j.nutrition;
    if (j.prepTime && !r.prepTime) r.prepTime = j.prepTime;
    if (j.cookTime && !r.cookTime) r.cookTime = j.cookTime;
    r.importedAt = now();
  }
  F.saved = true; F.savedId = r.id;
  F.uploaded.filter(id => id !== r.photoId).forEach(deleteAsset);
  F.uploadedLocal.filter(k => k !== r.photoKey).forEach(delPhotoKey);
  const oldPhoto = base && base.photoId, oldKey = base && base.photoKey;
  putRecipe(r);
  if (oldPhoto && oldPhoto !== r.photoId) maybeDeleteAsset(oldPhoto, r.id);
  if (oldKey && oldKey !== r.photoKey) maybeDeletePhotoKey(oldKey, r.id);
  closeSheet();
  if (!base) { go({name:'recipe', id:r.id}); toast('Saved to your Yums'); }
  else toast('Changes saved');
}
function editorCleanup(){ if (!F) return; F.closed = true; if (!F.saved) { F.uploaded.forEach(deleteAsset); F.uploadedLocal.forEach(delPhotoKey); } F = null; }

/* ---------- backup ---------- */
async function exportBackup(){
  toast('Putting your backup together…');
  const recs = [];
  for (const r of list()) {
    const o = Object.assign({}, r);
    if (r.photoKey && IDB.db) { try { const b = await IDB.get('photos', r.photoKey); if (b) o.photoData = await blobToDataURL(b); } catch (e) {} }
    else if (r.photoId) { try { const res = await fetch('/_blob/' + r.photoId); if (res.ok) o.photoData = await blobToDataURL(await res.blob()); } catch (e) {} }
    delete o.photoKey;
    recs.push(o);
  }
  const data = JSON.stringify({app:'yumyumtumtum', version:1, exportedAt:now(), settings:Store.settings, collections:Array.from(Store.cols.values()), recipes:recs});
  const name = 'yumyumtumtum-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  if (Store.downloads) {
    try { await Store.downloads.save({filename:name, data:data}); toast('Backup saved'); }
    catch (e) { if (!(e && e.code === 'declined')) toast("Couldn't save the backup. Try again in a moment."); else hideToast(); }
    return;
  }
  if (window.top === window) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Backup saved');
    return;
  }
  toast('Downloading a backup is not available in this view.');
}
async function restoreBackup(file){
  let o = null;
  try { o = JSON.parse(await file.text()); } catch (e) {}
  if (!o || o.app !== 'yumyumtumtum' || !Array.isArray(o.recipes)) { toast("That file isn't a yumyumtumtum backup."); return; }
  const cols = Array.isArray(o.collections) ? o.collections : [];
  const ok = await confirmBox({title:'Restore this backup?', msg:'Adds ' + plural(o.recipes.length, 'recipe') + ' and ' + plural(cols.length, 'collection') + '. Anything with the same ID gets replaced by the backup copy.', ok:'Restore', danger:false});
  if (!ok) return;
  toast('Restoring…');
  cols.forEach(c => { if (c && c.id && c.name) putCol({id:String(c.id), name:String(c.name).slice(0, 60), createdAt:c.createdAt || now(), sample:!!c.sample}); });
  for (const r0 of o.recipes) {
    if (!r0 || !r0.id || !r0.title) continue;
    const r = Object.assign({}, r0); delete r.photoKey;
    if (r.photoData) {
      const b = dataURLToBlob(r.photoData);
      if (b && Store.mode === 'cloud' && Store.assets) { try { const up = await Store.assets.upload(b, {type:/^image\/(png|jpeg|gif|webp)$/.test(b.type) ? b.type : 'image/jpeg'}); r.photoId = up.id; delete r.photoData; } catch (e) {} }
      else if (b && onPhone()) { try { const key = 'p-' + uid(); await IDB.put('photos', b, key); r.photoKey = key; delete r.photoData; delete r.photoId; } catch (e) {} }
      if (r.photoData) { delete r.photoId; if (Store.mode === 'cloud' && r.photoData.length > 180000) delete r.photoData; }
    } else if (Store.mode !== 'cloud') delete r.photoId;
    putRecipe(r);
  }
  if (o.settings && typeof o.settings.name === 'string') putSettings({name:o.settings.name.slice(0, 40)});
  if (o.settings && o.settings.pantry && Array.isArray(o.settings.pantry.items) && !hasKitchen()) putSettings({pantry:o.settings.pantry});
  if (o.settings && o.settings.taste && Array.isArray(o.settings.taste.never)) { const T = tasteStore(); putSettings({taste:Object.assign({}, T, {never:neverList().concat(o.settings.taste.never.filter(x => typeof x === 'string' && !neverList().some(y => y.toLowerCase() === x.toLowerCase())))})}); }
  toast('Backup restored');
}
async function removeExamples(){
  const ex = list().filter(r => r.sample);
  const ok = await confirmBox({title:'Remove the examples?', msg:'Deletes ' + plural(ex.length, 'example recipe') + ' and any example collections you haven\'t used. Your own recipes stay.', ok:'Remove'});
  if (!ok) return;
  ex.forEach(r => delRecipe(r.id));
  Array.from(Store.cols.values()).forEach(c => { if (c.sample && !list().some(r => (r.collections || []).indexOf(c.id) >= 0)) delCol(c.id); });
  toast('Examples removed');
}

  catretry: () => loadFeed('k:' + cur().key, true),
  catmore: () => { const r = cur(); r.mshown = (r.mshown || 12) + 12; refresh(); },
  nvadd: () => { const i = $('#neverin'); if (!i) return; const v = i.value.trim(); if (!v) { i.focus(); return; } i.value = ''; i.blur(); addNever(v); }
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'neverin') { e.preventDefault(); A.nvadd(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-dsave],[data-dnope],[data-dopen],[data-dk],[data-dfind],[data-fav],[data-open],[data-go],[data-col],[data-act],[data-f],[data-ff],[data-hf],[data-rate],[data-tab],[data-fm],[data-fc],[data-rmtag],[data-tc],[data-sort],[data-tagq],[data-step],[data-jump]');
  if (!t) return;
  const d = t.dataset;
  if (d.dsave) { e.preventDefault(); saveDiscovered(d.dsave); return; }
  if (d.dnope) { e.preventDefault(); hideDiscovered(d.dnope); return; }
  if (d.dopen) { openDiscover(d.dopen); return; }
  if (d.dk) { const r = cur(); r.key = d.dk; r.shown = 24; r.scroll = 0; if (d.dk.indexOf('c:') === 0) { const T = tasteStore(), k = 'cuisine:' + d.dk.slice(2).toLowerCase(); putSettings({taste:Object.assign({}, T, {w:Object.assign({}, T.w, {[k]:Math.min(6, (T.w[k] || 0) + 0.2)})})}); } show(false); return; }
  if (d.dfind) { go({name:'discover', key:'q:' + d.dfind}); return; }
  if (d.fav) { e.preventDefault(); toggleFav(d.fav); return; }
  if (d.open) { go({name:'recipe', id:d.open}); return; }
  if (d.tab) { if (cur().name === d.tab && stack.length === 1) { window.scrollTo({top:0, behavior:'smooth'}); return; } go({name:d.tab}); return; }
  if (d.go) { go({name:d.go, focus:d.focus === '1'}); return; }
  if (d.col) { go({name:'col', id:d.col}); return; }
  if (d.hf) { S = SEARCH_DEFAULT(); const p = d.hf.split(':'); toggleF(p[0], p[1]); go({name:'search'}); return; }
  if (d.f) { const p = d.f.split(':'); toggleF(p[0], p[1]); renderResults(); return; }
  if (d.ff) { const p = d.ff.split(':'); toggleF(p[0], p[1]); drawFilters(); renderResults(); return; }
  if (d.sort) { S.sort = d.sort; closeSheet(); renderResults(); return; }
  if (d.rate) { rate(cur().id, +d.rate); return; }
  if (d.fm) { if (F.meal.has(d.fm)) F.meal.delete(d.fm); else F.meal.add(d.fm); renderFMeals(); renderPrev(); return; }
  if (d.fc) { if (F.cols.has(d.fc)) F.cols.delete(d.fc); else F.cols.add(d.fc); renderFCols(); return; }
  if (d.rmtag != null) { F.tags.splice(+d.rmtag, 1); renderTags(); return; }
  if (d.tc) { toggleRecipeCol(addToRid, d.tc); return; }
  if (d.tagq) { S = SEARCH_DEFAULT(); S.q = d.tagq; go({name:'search'}); return; }
  if (d.step != null) { const id = cur().id; const c = (CHECKS[id] = CHECKS[id] || {}); const k = 's' + d.step; c[k] = !c[k]; t.classList.toggle('done', c[k]); return; }
  if (d.jump) { const el = document.getElementById(d.jump); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if (d.act && A[d.act]) A[d.act](t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(false); else if (!$('#sheet').hidden) closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('article[data-open],article[data-dopen]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-chk]')) { const id = cur().id; (CHECKS[id] = CHECKS[id] || {})[t.dataset.chk] = t.checked; }
  else if (t.id === 'myname') { const v = t.value.trim().slice(0, 40); if (v !== (Store.settings.name || '')) { putSettings({name:v}); toast('Name saved'); } }
  else if (t.id === 'restore') { const f = t.files && t.files[0]; t.value = ''; if (f) restoreBackup(f); }
});
document.addEventListener('error', e => {
  const t = e.target; if (!t || t.tagName !== 'IMG') return;
  if (t.hasAttribute('data-ph')) { t.remove(); return; }
  // recipe-site photos that won't load straight onto the phone go through the reader instead
  if (t.hasAttribute('data-dimg')) { if (!t.dataset.tried && canRead()) { t.dataset.tried = '1'; t.src = READER + '/api/image?url=' + encodeURIComponent(t.getAttribute('src')); } else t.remove(); }
}, true);

/* ---------- install + sharing (installed phone app only) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; refresh(); });
window.addEventListener('appinstalled', () => { installEvt = null; refresh(); toast('Installed. Look for yumyumtumtum on your home screen.'); });
async function installApp(){
  if (!installEvt) { toast('Use Chrome\'s menu and tap Install app.'); return; }
  const e = installEvt; installEvt = null;
  try { await e.prompt(); await e.userChoice; } catch (err) {}
  refresh();
}
function readShare(){
  if (window.top !== window) return null;
  let p; try { p = new URLSearchParams(location.search); } catch (e) { return null; }
  const out = {add:p.has('add'), cook:p.has('cook'), title:(p.get('title') || '').trim(), text:(p.get('text') || '').trim(), url:(p.get('url') || '').trim()};
  if (!out.add && !out.cook && !out.title && !out.text && !out.url) return null;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  return out;
}

/* ---------- boot ---------- */
async function startLocal(){
  Store.mode = 'local';
  try {
    await IDB.open();
    const res = await Promise.all([IDB.all('recipes'), IDB.all('collections'), IDB.get('meta', 'settings'), IDB.get('meta', 'seeded')]);
    Store.local = 'idb';
    if (res[0].length || res[1].length || res[3]) fill({recipes:res[0], collections:res[1], settings:res[2] || {}});
    else {
      const old = readLS(LOCAL_KEY);
      if (old) fill(old); else loadExamples();
      await Promise.all(list().map(r => IDB.put('recipes', clone(r)))
        .concat(Array.from(Store.cols.values()).map(c => IDB.put('collections', clone(c))))
        .concat([IDB.put('meta', clone(Store.settings), 'settings'), IDB.put('meta', true, 'seeded')]));
    }
    try { if (window.top === window && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  } catch (e) {
    Store.local = 'ls';
    const saved = readLS(LOCAL_KEY);
    if (saved) fill(saved); else loadExamples();
  }
  bootDone();
}
async function boot(){
  const framed = !!(window.claude && typeof window.claude.use === 'function');
  const share = readShare();
  if (framed) {
    const cache = readLS(CACHE_KEY);
    if (cache) fill(cache); else loadExamples();
    show(true);
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (db) {
      Store.db = db; Store.mode = 'cloud'; bootDone();
      let warned = false;
      const onErr = () => { if (!warned) { warned = true; toast("Couldn't reach your recipe box. Reload to try again."); } };
      try {
        db.collection('recipes').onSnapshot(s => { Store.recipes = new Map(s.docs.filter(x => x.exists).map(x => [x.id, Object.assign({}, x.data(), {id:x.id})])); saveSoon(CACHE_KEY); refresh(); }, onErr);
        db.collection('collections').onSnapshot(s => { Store.cols = new Map(s.docs.filter(x => x.exists).map(x => [x.id, Object.assign({}, x.data(), {id:x.id})])); saveSoon(CACHE_KEY); refresh(); }, onErr);
        db.doc('meta/settings').onSnapshot(s => { if (s.exists) { Store.settings = Object.assign({}, DEFAULT_SETTINGS, s.data()); saveSoon(CACHE_KEY); refresh(); } }, onErr);
      } catch (e) { onErr(); }
      refresh();
      try { const res = await Promise.all([window.claude.use('assets'), window.claude.use('downloads')]); Store.assets = res[0]; Store.downloads = res[1]; refresh(); } catch (e) {}
      return;
    }
    await startLocal(); refresh();
    return;
  }
  await startLocal();
  show(true);
  if (share && share.cook && !share.add) go({name:'cook'});
  else if (share) openEditor(null, (share.title || share.text || share.url) ? share : null);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
}
$('#tabs').innerHTML = navHTML();
boot();
})();
</script>
