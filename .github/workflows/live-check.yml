name: live-check
on:
  push:
    branches: [live-check]
    paths: ['.github/workflows/live-check.yml', 'live-check/urls.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the checks
        run: |
          mkdir -p live-check; out=live-check/out.txt; : > $out
          : > list.txt
          while read -r u; do
            case "$u" in
              find\ *) curl -sS -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -L "${u#find }" | grep -oE 'instagram\.com/(reel|p)/[A-Za-z0-9_-]{6,}' | sort -u | head -3 | sed 's#^#https://www.#' >> list.txt ;;
              findbot\ *) curl -sS -m 30 -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -L "${u#findbot }" > fb.html; grep -oE '"(code|shortcode)":"D[A-Za-z0-9_-]{9,12}"' fb.html | sort -u | head -6 | sed -E 's#.*:"([^"]+)"#https://www.instagram.com/reel/\1/#' >> list.txt; echo "findbot bytes $(wc -c < fb.html) codes $(grep -oE '"(code|shortcode)":"[A-Za-z0-9_-]{9,14}"' fb.html | sort -u | head -12 | tr '\n' ' ')" >> $out ;;
              save\ *) set -- ${u#save }; mkdir -p live-check/pages; curl -sS -m 30 -A "$2" -L "$3" | gzip -9 > "live-check/pages/$1.html.gz"; echo "saved $1 $(zcat live-check/pages/$1.html.gz | wc -c)" >> $out ;;
              *) echo "$u" >> list.txt ;;
            esac
          done < live-check/urls.txt
          echo "LIST:" >> $out; cat list.txt >> $out
          while read -r line; do
            [ -z "$line" ] && continue
            u="${line%%|*}"; x=""; case "$line" in *\|*) x="${line#*|}";; esac
            r=$(curl -sS -m 70 "https://yumyumtumtum.vercel.app/api/recipe?url=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$u")&debug=1&v=ua$(date +%s)$x")
            echo "READER $u $x => $(echo "$r" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.ok?"ok":"FAIL "+j.error)+" | title "+(j.title||"").slice(0,50)+" | caption "+(j.caption||"").length+" | ing "+(j.ingredients||[]).length+" | steps "+(j.steps||[]).length+" | "+JSON.stringify(j.trace||[]))}catch(e){console.log("bad json "+s.slice(0,200))}})')" >> $out
            case "$x" in *probe*) ;; *) continue;; esac
            code=$(echo "$u" | sed -nE 's#.*instagram\.com/(.*/)?(p|reels?|tv)/([A-Za-z0-9_-]+).*#\3#p')
            for ua in "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "Twitterbot/1.0" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"; do
              for pg in "https://www.instagram.com/reel/$code/" "https://www.instagram.com/p/$code/embed/"; do
                curl -sS -m 30 -A "$ua" -o page.html -w "%{http_code} %{url_effective} %{size_download}" -L "$pg" > meta.txt
                d=$(node live-check/probe.js page.html 2>&1 | tail -1)
                echo "$code | ${ua:0:22} | ${pg#https://www.instagram.com/} | $(cat meta.txt) | $d" >> $out
              done
            done
          done < list.txt
          git config user.name live-check; git config user.email live-check@users.noreply.github.com
          git add $out live-check/pages 2>/dev/null; git commit -m "live check results [skip ci]" -q; git push -q
