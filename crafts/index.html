<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brush &amp; Glue</title>
<meta name="description" content="Save painting and craft ideas from Instagram, TikTok, YouTube, Pinterest and any website.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo-128.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: a Pinterest-style board. Masonry of rounded photo pins, text tabs on top, five icons pinned to the bottom. */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#5f5f5f; --soft:#efefef; --soft-2:#e2e2e2; --line:#e6e6e6; --sheet:#ffffff;
  --red:#e60023; --red-press:#b3001b; --on-red:#ffffff; --ink:#111111; --on-ink:#ffffff;
  --ph-p:#e3e9fb; --ph-p-ink:#1f2f66; --ph-c:#dcefe5; --ph-c-ink:#124a36;
  --scrim:rgba(0,0,0,.42);
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r:16px; --gap:8px; --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111111; --fg:#f1f1f1; --muted:#a8a8a8; --soft:#262626; --soft-2:#353535; --line:#2b2b2b; --sheet:#1c1c1c;
    --ink:#f1f1f1; --on-ink:#111111;
    --ph-p:#232c4d; --ph-p-ink:#d1dbff; --ph-c:#1a392d; --ph-c-ink:#bcecd7;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #0074e8;outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

#main{max-width:1280px;margin:0 auto;padding:0 10px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}

/* top of each tab */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -10px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 4px}
.tabs{display:flex;justify-content:center;gap:26px}
.tabs button{border:0;background:none;font-weight:700;font-size:16px;padding:10px 2px 12px;position:relative;color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:3px;border-radius:2px;background:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--soft);border-radius:999px;padding:10px 15px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pagehead{padding:calc(env(safe-area-inset-top,0px) + 14px) 4px 6px}
.pagehead h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.pagehead p{margin:4px 0 0;color:var(--muted)}
h2.sect{font-size:20px;font-weight:800;margin:26px 4px 8px;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* masonry of pins */
.masonry{display:flex;gap:var(--gap);align-items:flex-start;margin-top:6px}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.pin{position:relative;cursor:pointer;min-width:0}
.pin-media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.pin-media img{display:block;width:100%;height:100%;object-fit:cover}
.pin-media.ph{display:flex;align-items:flex-end;padding:14px 12px;font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.pin-media.ph.painting{background:var(--ph-p);color:var(--ph-p-ink)}
.pin-media.ph.craft{background:var(--ph-c);color:var(--ph-c-ink)}
.pin-foot{display:flex;align-items:flex-start;gap:2px;padding:6px 0 0 4px}
.pin-text{flex:1;min-width:0}
.pin-title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pin-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dots{border:0;background:none;width:30px;height:24px;display:grid;place-items:center;border-radius:12px;flex:none;color:var(--fg)}
.dots .ic{width:20px;height:20px}
.badge{position:absolute;display:grid;place-items:center;border-radius:999px}
.badge.play{left:8px;top:8px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff}
.badge.play .ic{width:14px;height:14px}
.badge.fav{right:8px;bottom:8px;width:30px;height:30px;background:#fff;color:#e60023;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.badge.fav .ic{width:17px;height:17px}
.badge.made{left:8px;bottom:8px;padding:4px 9px 4px 7px;background:#fff;color:#111;font-size:12px;font-weight:700;gap:3px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.badge.made .ic{width:14px;height:14px;stroke-width:3}
.save-pill{position:absolute;right:8px;top:8px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:9px 14px}
.save-pill.done{background:#111;color:#fff}
.skel{border-radius:var(--r);background:var(--soft);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}

/* empty / welcome */
.welcome{margin:16px 4px 6px;padding:22px 18px;border-radius:24px;background:var(--soft)}
.welcome h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.welcome p{margin:0 0 12px;color:var(--muted)}
.steps{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.btn .ic{width:20px;height:20px}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.red:active{background:var(--red-press)}
.btn.gray{background:var(--soft);color:var(--fg)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.sm{height:38px;padding:0 15px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.note{margin:10px 4px;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:14px;color:var(--muted)}
.center{text-align:center}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--soft-2);border-top-color:var(--red);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loadrow{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;color:var(--muted)}

/* pin page */
.cu{max-width:640px;margin:0 auto}
.cu-media{position:relative;border-radius:28px;overflow:hidden;background:var(--soft);margin:calc(env(safe-area-inset-top,0px) + 8px) -2px 0}
.cu-media img{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover}
.cu-media.ph{min-height:260px;display:flex;align-items:flex-end;padding:24px;font-size:26px;font-weight:800;line-height:1.15}
.cu-media.ph.painting{background:var(--ph-p);color:var(--ph-p-ink)}
.cu-media.ph.craft{background:var(--ph-c);color:var(--ph-c-ink)}
.cu-media iframe{display:block;width:100%;border:0;background:#000}
.cu-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.22)}
.round .ic{width:22px;height:22px}
.playbig{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.playbig .ic{width:30px;height:30px}
.cu-actions{display:flex;align-items:center;gap:6px;padding:12px 2px 4px}
.cu-actions .grow{flex:1}
.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
.iconbtn.on{color:var(--red)}
.iconbtn.on .ic{fill:currentColor}
.cu-body{padding:4px 6px 0}
.by{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.pdot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.by b{display:block;font-size:15px}
.by small{color:var(--muted);font-size:13px}
.cu h1{font-size:26px;line-height:1.2;font-weight:800;margin:4px 0 8px;letter-spacing:-.01em;overflow-wrap:anywhere}
.cap{white-space:pre-line;margin:0 0 6px;overflow-wrap:anywhere}
.cap.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.boardrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.bpill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--soft);padding:9px 14px;font-weight:700;font-size:14px}
.bpill .ic{width:18px;height:18px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--soft);border-radius:999px;margin:12px 0}
.seg2 button{border:0;background:none;border-radius:999px;height:40px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.taglist button,.taglist span{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.minihead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.sup{margin:0;padding-left:20px}
.sup li{margin:3px 0}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:18px 10px;margin-top:10px}
.board{cursor:pointer;min-width:0}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1.45/1;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.collage > div{background:var(--soft-2);min-width:0;min-height:0}
.collage > div:first-child{grid-row:1 / span 2}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.board b{display:block;margin:7px 2px 0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board small{display:block;margin:0 2px;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:1.7/1;background:var(--soft);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.tile.painting{background:var(--ph-p)}
.tile.craft{background:var(--ph-c)}
.tile.noimg span{background:none;color:var(--fg)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0}
.split i{display:block;height:100%}
.searchbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--soft);color:var(--muted)}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--fg);height:100%}
.searchbar input::placeholder{color:var(--muted)}
.panel{margin:10px 0;padding:16px;border-radius:20px;background:var(--soft)}
.panel h3{margin:0 0 6px;font-size:16px}

/* bottom icons */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:2px 6px env(safe-area-inset-bottom,0px)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{border:0;background:none;color:var(--muted);height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600}
#nav button[aria-current="page"]{color:var(--fg)}
#nav button[aria-current="page"] .ic{stroke-width:2.7}
#nav .ic{width:26px;height:26px}

/* sheets */
#sheetwrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:640px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:720px){#sheetwrap{align-items:center}#sheet{border-radius:26px;max-height:92%}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--soft-2);margin:4px auto 8px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.shead h2{margin:0;font-size:20px;font-weight:800}
.field{display:grid;gap:6px;margin-top:14px}
.field > label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{width:100%;min-width:0;border:2px solid transparent;border-radius:16px;background:var(--soft);padding:12px 14px;font-size:16px;color:var(--fg);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--soft-2)}
.field textarea{resize:vertical;min-height:70px}
.preview{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:18px;background:var(--soft)}
.preview .thumb{width:74px;height:92px;border-radius:12px;overflow:hidden;flex:none;background:var(--soft-2)}
.preview .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.preview .ptext{min-width:0;flex:1}
.preview .ptext b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.preview small{color:var(--muted);font-size:13px}
.boardpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.boardpick button{height:54px;border-radius:16px;border:2px solid var(--soft-2);background:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px}
.boardpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.boardpick.ask button{border-color:var(--red)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:0;background:var(--soft);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px}
.catpick button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.hint.bad{color:var(--red)}
.sactions{display:flex;gap:8px;margin-top:18px}
.sactions .btn{flex:1}
.menu{display:grid;gap:2px;margin-top:4px}
.menu button{display:flex;align-items:center;gap:14px;border:0;background:none;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:600;text-align:left}
.menu button:active{background:var(--soft)}
.menu button.danger{color:var(--red)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:#111;color:#fff;border-radius:16px;padding:12px 14px 12px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px);width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:#fff;color:#111;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>

<nav id="nav" aria-label="Sections">
  <div class="in">
    <button data-tab="home" aria-label="Home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>Home</button>
    <button data-tab="search" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Search</button>
    <button data-tab="add" aria-label="Save an idea"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    <button data-tab="ideas" aria-label="Ideas for you"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</button>
    <button data-tab="saved" aria-label="Your boards"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></svg>Boards</button>
  </div>
</nav>

<div id="sheetwrap" hidden><div id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script src="cats.js"></script>
<script>
(() => {
'use strict';
const VERSION = '1.0';
const READER_V = 1;
const Cats = window.Cats;
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = (LOCAL || /(^|\.)vercel\.app$/.test(location.hostname)) ? '' : 'https://yumyumtumtum.vercel.app';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const I = (d, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  dots: '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>',
  heart: '<path d="M12 20.3l-1.2-1.1C6.2 15.1 3.5 12.6 3.5 9.4 3.5 6.9 5.4 5 7.9 5c1.6 0 3.1.8 4.1 2 1-1.2 2.5-2 4.1-2 2.5 0 4.4 1.9 4.4 4.4 0 3.2-2.7 5.7-7.3 9.8z"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',
  play: '<path d="M8 5v14l11-7z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

const DB = {
  db: null, mem: { pins: new Map(), photos: new Map(), kv: new Map() },
  open() {
    return new Promise(res => {
      let r;
      try { r = indexedDB.open('brushglue', 1); } catch (e) { res(false); return; }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('pins', { keyPath: 'id' }); d.createObjectStore('photos'); d.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; res(true); };
      r.onerror = () => res(false);
    });
  },
  req(store, mode, fn) {
    if (!this.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && 'result' in q ? q.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.db ? this.req(store, 'readonly', s => s.getAll()) : Promise.resolve(Array.from(this.mem[store].values())); },
  get(store, key) { return this.db ? this.req(store, 'readonly', s => s.get(key)) : Promise.resolve(this.mem[store].get(key)); },
  put(store, val, key) {
    if (!this.db) { this.mem[store].set(key === undefined ? val.id : key, val); return Promise.resolve(); }
    return this.req(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key));
  },
  del(store, key) { if (!this.db) { this.mem[store].delete(key); return Promise.resolve(); } return this.req(store, 'readwrite', s => s.delete(key)); }

  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); });

/* ---------- what it learns ---------- */
const GENERIC_TAGS = new Set(['easy', 'kids', 'gift', 'diy', 'craft', 'crafts', 'painting', 'art']);

    const w = weightOf(p), ck = p.type + ':' + p.category;
    type[p.type] += w;
    cat[ck] = (cat[ck] || 0) + w; catN[ck] = (catN[ck] || 0) + 1;

/* ---------- Ideas for you (painting and craft blogs, ranked on the phone) ---------- */
const CAT_Q = {
  painting: { acrylic: 'acrylic painting', watercolor: 'watercolor', pour: 'acrylic pour', rock: 'painted rocks', dot: 'dot mandala', objects: 'painted pumpkins', oil: 'oil painting', gouache: 'gouache', spray: 'spray paint', furniture: 'painted furniture', wall: 'mural', drawing: 'drawing', kids: 'painting for kids', other: 'painting' },

const SEASON = [['valentines', 'winter'], ['valentines', 'winter'], ['st patricks', 'spring'], ['easter', 'spring'], ['spring', 'mothers day'], ['summer', 'fathers day'], ['4th of july', 'summer'], ['summer', 'back to school'], ['fall', 'back to school'], ['halloween', 'fall'], ['thanksgiving', 'fall'], ['christmas', 'winter']];
function catQuery(type, id) {
  if (type === 'craft' && id === 'holiday') return SEASON[new Date().getMonth()][0] + ' craft';
  if (type === 'painting' && id === 'objects' && ![8, 9, 10].includes(new Date().getMonth())) return 'glass painting';

function ideaQueries(topic) {

    if (topic.startsWith('tag:')) return [{ q: topic.slice(4), type: 'both', reason: '' }];
    return [{ q: topic, type: 'both', reason: '' }];
  }
  const L = learn();
  const season = SEASON[new Date().getMonth()];
  const qs = [];
  for (const c of topCats(L, 3)) {
    const q = catQuery(c.type, c.id);
    if (q) qs.push({ q, type: c.type, reason: 'Because you like ' + Cats.catLabel(c.type, c.id) });
  }
  const tags = topTags(L, 2);
  if (tags[0]) {
    const lead = L.type.craft > L.type.painting ? 'craft' : 'painting';
    qs.push({ q: tags[0] + ' ' + lead, type: lead, reason: 'Because you save #' + tags[0] + ' ideas' });
  }
  qs.push({ q: season[0] + ' craft', type: 'craft', reason: 'For ' + titleCase(season[0]) });
  qs.push({ q: season[0] === 'fall' ? 'fall painting' : season[0] + ' painting', type: 'painting', reason: 'For ' + titleCase(season[0]) });
  if (qs.length < 5) for (const d of [{ q: 'acrylic painting', type: 'painting' }, { q: 'painted rocks', type: 'painting' }, { q: 'wood craft', type: 'craft' }, { q: 'watercolor', type: 'painting' }, { q: 'dollar tree craft', type: 'craft' }]) {
    if (qs.length >= 5) break;
    if (!qs.some(x => x.q === d.q)) qs.push(Object.assign({ reason: 'To get you started' }, d));

async function loadIdeas(force, append) {

    if (topic === 'foryou') {

function renderRoute(keepScroll) {

  const tab = TABS.includes(r.v) ? r.v : (r.from || '');
  for (const b of $$('#nav button')) { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
  const main = $('#main');
  const y = window.scrollY;
  if (!S.ready) { main.innerHTML = `<div class="loadrow" style="margin-top:40vh"><span class="spinner"></span>Opening your boards…</div>`; return; }
  if (r.v === 'home') main.innerHTML = vHome();
  else if (r.v === 'search') main.innerHTML = vSearch();
  else if (r.v === 'ideas') main.innerHTML = vIdeas();
  else if (r.v === 'saved') main.innerHTML = vSaved();
  else if (r.v === 'board') main.innerHTML = vBoard(r.key);
  else if (r.v === 'pin') main.innerHTML = vPin(S.pins.find(p => p.id === r.id));
  else if (r.v === 'idea') main.innerHTML = vIdea(S.web.get(r.k) || r.item);
  else main.innerHTML = vHome();
  hydrate(main);
  if (keepScroll) window.scrollTo(0, y);
  if (r.v === 'pin' || r.v === 'idea') loadMore(r);
  if (r.v === 'ideas' || (r.v === 'home' && S.pins.filter(p => !p.example).length < 6)) loadIdeas(false);
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!['pin', 'idea'].includes(S.route.v)) renderRoute(true); }, 200); });

/* ---------- Home ---------- */
function vHome() {
  const tab = S.homeTab;
  const mine = S.pins.filter(p => tab === 'all' || p.type === tab);
  const counts = {};
  for (const p of mine) counts[p.category] = (counts[p.category] || 0) + 1;
  if (S.homeCat !== 'all' && !counts[S.homeCat]) S.homeCat = 'all';
  const list = mine.filter(p => S.homeCat === 'all' || p.category === S.homeCat).sort((a, b) => b.createdAt - a.createdAt);
  let h = `<div class="topbar"><div class="tabs" role="tablist">${[['all', 'All'], ['painting', 'Painting'], ['craft', 'Crafts']].map(([k, l]) => `<button role="tab" data-act="home-tab" data-t="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>`;
  if (tab !== 'all' && mine.length) {
    h += `<div class="chips"><button class="chip" data-act="home-cat" data-c="all" aria-pressed="${S.homeCat === 'all'}">All ${tab === 'craft' ? 'crafts' : 'painting'}</button>${Cats.catList(tab).filter(c => counts[c.id]).map(c => `<button class="chip" data-act="home-cat" data-c="${c.id}" aria-pressed="${S.homeCat === c.id}">${esc(c.label)}</button>`).join('')}</div>`;
  }
  h += `</div>`;
  if (!S.pins.length) {
    h += welcome();
  } else if (!mine.length) {
    h += `<div class="note">No ${tab === 'craft' ? 'craft' : 'painting'} ideas yet. Share a post to Brush &amp; Glue and it lands here.</div>`;
  } else {
    h += masonry(list, pinCard);
  }
  const real = S.pins.filter(p => !p.example).length;
  if (tab === 'all' && real < 6) {
    h += `<h2 class="sect">${S.pins.length ? 'More ideas for you' : 'Ideas to get you started'}</h2>` + ideasBlock(12);
  }
  return h;
}
function welcome() {
  const inst = standalone() ? '' : `<div class="note" style="margin:0 0 14px;background:var(--bg)"><b>Install it first</b> so Brush &amp; Glue shows up in the Share menu.<div class="row" style="margin-top:10px">${S.installEvt ? `<button class="btn red sm" data-act="install">Install app</button>` : ''}<span>${S.installEvt ? 'Or in' : 'In'} Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</span></div></div>`;
  return `<div class="welcome"><h1>Save your first idea</h1>
    ${inst}
    <ol class="steps">
      <li><span>Open a video or post in Instagram, TikTok, YouTube, Facebook or Pinterest.</span></li>
      <li><span>Tap <b>Share</b>, then pick <b>Brush &amp; Glue</b>. In Instagram, tap <b>Share</b> and then <b>Share to…</b> if you don’t see it.</span></li>
      <li><span>It reads the post and files it under <b>Painting</b> or <b>Crafts</b> for you.</span></li>
    </ol>
    <button class="btn red" data-act="add">${I(IC.plus)}Paste a link instead</button></div>`;
}
function ideasBlock(max) {
  const it = S.ideas;
  if (it.items.length) return masonry(it.items.slice(0, max || 200), ideaCard);
  if (it.loading) return skeleton(8);
  if (it.error) return `<div class="note center">${esc(it.error)}<div style="margin-top:10px"><button class="btn gray sm" data-act="ideas-retry">Try again</button></div></div>`;
  return skeleton(8);
}

/* ---------- Ideas for you ---------- */
function vIdeas() {
  const L = learn();
  const chips = [{ id: 'foryou', label: 'For you' }];
  for (const c of topCats(L, 4)) if (catQuery(c.type, c.id)) chips.push({ id: 'cat:' + c.type + ':' + c.id, label: Cats.catLabel(c.type, c.id) });
  for (const t of topTags(L, 3)) chips.push({ id: 'tag:' + t, label: '#' + t });
  const season = SEASON[new Date().getMonth()];
  for (const s of season) chips.push({ id: s + ' craft', label: titleCase(s) });
  for (const d of ['acrylic painting', 'painted rocks', 'watercolor', 'wood craft', 'crochet', 'cricut', 'resin', 'dollar tree craft']) if (!chips.some(c => c.label.toLowerCase() === d || c.id === d)) chips.push({ id: d, label: titleCase(d) });
  const seen = new Set();
  return `<div class="topbar"><div class="pagehead" style="padding-top:8px"><h1>Ideas for you</h1><p>${L.n ? `Picked from craft and painting blogs using what you save, heart and make.` : `Save a few ideas and these start leaning toward what you like.`}</p></div>
    <div class="chips">${chips.filter(c => !seen.has(c.id) && seen.add(c.id)).map(c => `<button class="chip" data-act="topic" data-t="${esc(c.id)}" aria-pressed="${S.ideas.topic === c.id}">${esc(c.label)}</button>`).join('')}</div></div>
    ${ideasBlock()}
    ${S.ideas.items.length ? `<div class="center" style="margin:22px 0">${S.ideas.loading ? `<div class="loadrow"><span class="spinner"></span>Finding more…</div>` : `<button class="btn gray" data-act="ideas-more">More ideas</button>`}</div>` : ''}`;
}

/* ---------- Search ---------- */
function vSearch() {
  return `<div class="topbar" style="padding-bottom:8px"><label class="searchbar" for="q">${I('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>')}
    <input id="q" type="search" enterkeyhint="search" placeholder="Search your ideas and craft blogs" value="${esc(S.search.q)}" autocomplete="off"></label></div>
    <div id="sres">${searchResults()}</div>`;
}
function searchResults() {
  const q = S.search.q.trim();
  if (!q) {
    const tiles = [];
    for (const type of ['painting', 'craft']) for (const c of Cats.catList(type)) {
      if (c.id === 'other' || !catQuery(type, c.id)) continue;
      const mine = S.pins.filter(p => p.type === type && p.category === c.id);
      tiles.push({ type, c, n: mine.length, pin: mine.find(p => p.photo || p.imageUrl) });
    }
    tiles.sort((a, b) => b.n - a.n);
    return `<h2 class="sect">Browse ideas</h2><div class="tiles">${tiles.map(t => `<button class="tile ${t.type}${t.pin ? '' : ' noimg'}" data-act="tile" data-type="${t.type}" data-c="${t.c.id}">${t.pin ? (t.pin.photo ? `<img data-photo="${esc(t.pin.id)}" alt="">` : `<img src="${esc(t.pin.imageUrl)}" data-orig="${esc(t.pin.imageUrl)}" data-proxy="1" referrerpolicy="no-referrer" alt="">`) : ''}<span>${esc(t.c.label)}${t.n ? ' · ' + t.n : ''}</span></button>`).join('')}</div>`;
  }
  const words = q.toLowerCase().replace(/^#/, '').split(/\s+/).filter(Boolean);
  const mine = S.pins.filter(p => {
    if (S.search.cat) return p.type + ':' + p.category === S.search.cat;
    const hay = [p.title, p.caption, p.notes, (p.tags || []).join(' '), (p.supplies || []).join(' '), Cats.catLabel(p.type, p.category), p.type === 'craft' ? 'craft crafts' : 'painting paint', p.author, p.siteName].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort((a, b) => b.createdAt - a.createdAt);
  let h = `<h2 class="sect">Your ideas${mine.length ? ' · ' + mine.length : ''}</h2>`;
  h += mine.length ? masonry(mine, pinCard) : `<div class="note">Nothing saved matches “${esc(q)}” yet.</div>`;
  h += `<h2 class="sect">From craft and painting blogs</h2>`;
  if (S.search.loading) h += skeleton(6);
  else if (S.search.error) h += `<div class="note">${esc(S.search.error)}</div>`;
  else if (S.search.results.length) h += masonry(S.search.results, ideaCard);
  else h += `<div class="note">No blog projects found for “${esc(q)}”. Try fewer words.</div>`;
  return h;
}
let searchT = 0, searchN = 0;
function runSearch(q, cat) {
  S.search.q = q; S.search.cat = cat || '';
  clearTimeout(searchT);
  const box = $('#sres');
  if (!q.trim()) { S.search.results = []; if (box) { box.innerHTML = searchResults(); hydrate(box); } return; }
  S.search.loading = true; S.search.error = '';
  if (box) { box.innerHTML = searchResults(); hydrate(box); }
  const my = ++searchN;
  searchT = setTimeout(async () => {
    let items = [];
    try { items = (await askCrafts(q.replace(/^#/, ''), 'both', 6)).map(x => webItem(x, '')); }
    catch (e) { if (my === searchN) S.search.error = navigator.onLine ? 'Couldn’t search the blogs right now.' : 'You’re offline. Blog search needs the internet.'; }
    if (my !== searchN) return;
    S.search.loading = false;
    const L = learn();
    const seenT = new Set();
    S.search.results = items.filter(x => !S.dismissed.has(x.url) && !seenT.has(tkey(x.title)) && seenT.add(tkey(x.title))).sort((a, b) => scoreItem(b, L) - scoreItem(a, L));
    const b = $('#sres');
    if (b && S.route.v === 'search') { b.innerHTML = searchResults(); hydrate(b); }
  }, 450);
}

/* ---------- Boards ---------- */
const BOARDS = [['all', 'All ideas'], ['painting', 'Painting'], ['craft', 'Crafts'], ['fav', 'Favorites'], ['want', 'Want to try'], ['made', 'Made it']];
function boardItems(key) {
  if (key === 'all') return S.pins.slice();
  if (key === 'painting' || key === 'craft') return S.pins.filter(p => p.type === key);
  if (key === 'fav') return S.pins.filter(p => p.liked);
  if (key === 'want') return S.pins.filter(p => p.status !== 'made');
  if (key === 'made') return S.pins.filter(p => p.status === 'made');
  if (key.startsWith('cat:')) { const [, t, c] = key.split(':'); return S.pins.filter(p => p.type === t && p.category === c); }
  return [];
}
function boardName(key) {
  const b = BOARDS.find(x => x[0] === key);
  if (b) return b[1];
  if (key.startsWith('cat:')) { const [, t, c] = key.split(':'); return Cats.catLabel(t, c); }
  return 'Board';
}
function collage(items) {
  const withPic = items.filter(p => p.photo || p.imageUrl).sort((a, b) => b.createdAt - a.createdAt).slice(0, 3);
  const cell = p => p ? (p.photo ? `<img data-photo="${esc(p.id)}" alt="">` : `<img src="${esc(p.imageUrl)}" data-orig="${esc(p.imageUrl)}" data-proxy="1" referrerpolicy="no-referrer" alt="">`) : '';
  return `<div class="collage"><div>${cell(withPic[0])}</div><div>${cell(withPic[1])}</div><div>${cell(withPic[2])}</div></div>`;
}
function boardCard(key) {
  const items = boardItems(key);
  return `<div class="board" data-act="board" data-key="${esc(key)}">${collage(items)}<b>${esc(boardName(key))}</b><small>${plural(items.length, 'idea')}</small></div>`;
}
function vSaved() {
  const L = learn();
  const keys = BOARDS.map(b => b[0]).filter(k => ['all', 'painting', 'craft'].includes(k) || boardItems(k).length);
  const cats = [];
  for (const type of ['painting', 'craft']) for (const c of Cats.catList(type)) if (S.pins.some(p => p.type === type && p.category === c.id)) cats.push('cat:' + type + ':' + c.id);
  const made = S.pins.filter(p => p.status === 'made').length;
  let h = `<div class="pagehead"><h1>Your boards</h1><p>${plural(S.pins.length, 'idea')} saved${made ? ' · ' + made + ' made' : ''}</p></div>`;
  if (!standalone()) h += `<div class="note"><b>Put it on your home screen</b> so it shows up in the Share menu.<div class="row" style="margin-top:10px">${S.installEvt ? `<button class="btn red sm" data-act="install">Install app</button>` : `<span>In Chrome, tap ⋮, then <b>Add to Home screen</b> or <b>Install app</b>.</span>`}</div></div>`;
  h += `<div class="boards">${keys.map(boardCard).join('')}</div>`;
  if (cats.length) h += `<h2 class="sect">By category</h2><div class="boards">${cats.map(boardCard).join('')}</div>`;
  h += `<h2 class="sect">What it’s learned</h2>`;
  if (!L.n) h += `<div class="note">Nothing yet. It learns from what you save, heart, mark as made and open, and from ideas you mark Not for me.</div>`;
  else {
    const tot = L.type.painting + L.type.craft || 1, pp = Math.round(L.type.painting / tot * 100);
    const tc = topCats(L, 5), tt = topTags(L, 10);
    h += `<div class="panel"><h3>${pp >= 60 ? 'You lean toward painting' : pp <= 40 ? 'You lean toward crafts' : 'A good mix of painting and crafts'}</h3>
      <div class="split" role="img" aria-label="${pp}% painting, ${100 - pp}% crafts"><i style="width:${pp}%;background:#3a5bd9"></i><i style="width:${100 - pp}%;background:#1a9a6c"></i></div>
      <div class="muted" style="font-size:13px">${pp}% painting · ${100 - pp}% crafts</div>
      ${tc.length ? `<div class="minihead">Favorite kinds</div><div class="taglist">${tc.map(c => `<span>${esc(Cats.catLabel(c.type, c.id))}</span>`).join('')}</div>` : ''}
      ${tt.length ? `<div class="minihead">Tags you come back to</div><div class="taglist">${tt.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
  }
  const avoid = Object.keys(S.taste.avoidTags).map(t => ({ k: 'tag', v: t, l: '#' + t })).concat(Object.keys(S.taste.avoidCats).map(c => { const [t, id] = c.split(':'); return { k: 'cat', v: c, l: Cats.catLabel(t, id) }; }));
  if (avoid.length) h += `<div class="panel"><h3>Not for me</h3><p class="muted" style="margin:0 0 6px;font-size:14px">Ideas like these show up less. Tap one to take it off.</p><div class="taglist">${avoid.map(a => `<button data-act="unavoid" data-k="${a.k}" data-v="${esc(a.v)}">${esc(a.l)} ✕</button>`).join('')}</div></div>`;
  h += `<h2 class="sect">Backup</h2><div class="panel"><p class="muted" style="margin:0 0 10px;font-size:14px">Your ideas and photos are saved on this phone. Download a backup now and then, or to move to a new phone.</p>
    <div class="row"><button class="btn ink sm" data-act="backup">${I(IC.download)}Download backup</button><button class="btn gray sm" data-act="restore">${I(IC.upload)}Restore a backup</button></div></div>
    <p class="muted center" style="font-size:12.5px;margin:22px 0">Brush &amp; Glue ${VERSION}</p>`;
  return h;
}
function vBoard(key) {
  const sorts = [['new', 'Newest'], ['az', 'A to Z'], ['opened', 'Most opened']];
  let items = boardItems(key);
  if (S.boardSort === 'az') items.sort((a, b) => a.title.localeCompare(b.title));
  else if (S.boardSort === 'opened') items.sort((a, b) => (b.opens || 0) - (a.opens || 0) || b.createdAt - a.createdAt);
  else items.sort((a, b) => b.createdAt - a.createdAt);
  return `<div class="topbar"><div class="row" style="padding-top:4px"><button class="iconbtn" data-act="back" aria-label="Back">${I(IC.back)}</button><div style="min-width:0"><h1 style="margin:0;font-size:22px;font-weight:800">${esc(boardName(key))}</h1><div class="muted" style="font-size:13px">${plural(items.length, 'idea')}</div></div></div>
    <div class="chips">${sorts.map(([k, l]) => `<button class="chip" data-act="board-sort" data-s="${k}" aria-pressed="${S.boardSort === k}">${l}</button>`).join('')}</div></div>
    ${items.length ? masonry(items, pinCard) : `<div class="note">Nothing here yet.</div>`}`;
}

/* ---------- a pin's own page ---------- */
function embedOf(p) {
  const u = p.url || '';
  if (p.platform === 'youtube') {
    const id = (u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{6,})/) || [])[1];
    if (id) return { src: 'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0', ar: /shorts\//.test(u) ? 1.78 : 0.5625 };
  }
  if (p.platform === 'tiktok') {
    const id = (u.match(/\/(?:video|photo)\/(\d{8,})/) || [])[1];
    if (id) return { src: 'https://www.tiktok.com/embed/v2/' + id, ar: 1.78 };
  }
  if (p.platform === 'instagram') {
    const code = (u.match(/instagram\.com\/(?:[\w.]+\/)?(?:p|reels?|tv)\/([\w-]{5,})/i) || [])[1];
    if (code) return { src: 'https://www.instagram.com/p/' + code + '/embed/', ar: 1.62 };
  }
  if (p.platform === 'facebook' && p.kind === 'video') return { src: 'https://www.facebook.com/plugins/video.php?href=' + enc(u) + '&show_text=false', ar: 1.78 };
  return null;
}
function openLabel(p) {
  const pl = PLAT[p.platform] || PLAT.web;
  if (p.platform === 'web') return 'Visit ' + (p.siteName || hostOf(p.url) || 'site');
  return pl.open;
}

  const who = p.author || p.siteName || hostOf(p.url);

    <div class="cu-media${media ? '' : ' ph ' + t}" id="cumedia">
      <div class="cu-top"><button class="round" data-act="back" aria-label="Back">${I(IC.back)}</button><button class="round" data-act="pin-menu" data-id="${esc(p.id)}" aria-label="More options">${I(IC.dots, 'fill')}</button></div>
      ${media || esc(p.title)}
      ${emb ? `<button class="playbig" data-act="play" data-id="${esc(p.id)}" aria-label="Play here">${I(IC.play, 'fill')}</button>` : ''}
    </div>
    <div class="cu-actions">
      <button class="iconbtn${p.liked ? ' on' : ''}" data-act="like" data-id="${esc(p.id)}" aria-pressed="${!!p.liked}" aria-label="${p.liked ? 'Remove from favorites' : 'Add to favorites'}">${I(IC.heart)}</button>
      <button class="iconbtn" data-act="share" data-id="${esc(p.id)}" aria-label="Share">${I(IC.share)}</button>
      <span class="grow"></span>
      ${p.url ? `<a class="btn gray" href="${esc(p.url)}" target="_blank" rel="noopener" data-act="open" data-id="${esc(p.id)}">${esc(openLabel(p))}</a>` : ''}
    </div>
    <div class="cu-body">
      ${who ? `<div class="by"><span class="pdot" style="background:${pl.color}">${pl.short}</span><div><b>${esc(who)}</b><small>${p.platform === 'web' ? esc(hostOf(p.url)) : 'on ' + pl.name}</small></div></div>` : ''}
      <h1>${esc(p.title)}</h1>
      ${p.caption && p.caption.trim() !== p.title ? `<p class="cap clip" id="cap">${esc(p.caption)}</p>${p.caption.length > 260 || (p.caption.match(/\n/g) || []).length > 4 ? `<button class="linkbtn" data-act="cap-more">More</button>` : ''}` : ''}
      <div class="boardrow">
        <button class="bpill" data-act="edit" data-id="${esc(p.id)}">${I(t === 'craft' ? IC.scissors : IC.brush)}${t === 'craft' ? 'Crafts' : 'Painting'} · ${esc(Cats.catLabel(t, p.category))}</button>

      ${(p.tags || []).length ? `<div class="taglist">${p.tags.map(g => `<button data-act="tag" data-t="${esc(g)}">#${esc(g)}</button>`).join('')}</div>` : ''}

      ${p.notes ? `<div class="minihead">Your notes</div><p class="cap">${esc(p.notes)}</p>` : ''}
      ${p.link ? `<div class="minihead">Project page</div><a href="${esc(p.link)}" target="_blank" rel="noopener" style="font-weight:700;overflow-wrap:anywhere">${esc(hostOf(p.link))}</a>` : ''}
    </div>
    <h2 class="sect">More like this</h2><div id="more">${skeleton(4)}</div>

}

  const saved = S.pins.find(p => p.url === it.url);
  const t = it.type;
  return `<div class="cu">
    <div class="cu-media" id="cumedia">
      <div class="cu-top"><button class="round" data-act="back" aria-label="Back">${I(IC.back)}</button><button class="round" data-act="idea-menu" data-k="${esc(it.key)}" aria-label="More options">${I(IC.dots, 'fill')}</button></div>
      <img src="${esc(it.image)}" data-orig="${esc(it.image)}" data-proxy="1" referrerpolicy="no-referrer" alt="">
    </div>

async function loadMore(r) {

  if (!base) { box.innerHTML = ''; return; }

  const own = S.pins.filter(p => p.url !== baseUrl).map(p => {
    let s = 0;
    if (p.type === base.type) s += 1;
    if (p.category === base.category && base.category !== 'other') s += 3;
    for (const t of p.tags || []) if ((base.tags || []).includes(t)) s += 1;
    return { p, s };
  }).filter(x => x.s >= 3).sort((a, b) => b.s - a.s).slice(0, 6).map(x => x.p);
  const tag = (base.tags || []).find(t => !GENERIC_TAGS.has(t) && t.length < 16);
  const q = [catQuery(base.type, base.category) || (base.type === 'craft' ? 'craft' : 'painting'), tag && !catQuery(base.type, base.category).includes(tag) ? tag : ''].join(' ').trim();

    const skip = new Set([tkey(base.title)].concat(own.map(p => tkey(p.title))));
    const w = (web || []).filter(x => x.url !== baseUrl && !S.dismissed.has(x.url) && !skip.has(tkey(x.title)) && (skip.add(tkey(x.title)), true));

    b.innerHTML = h;

  };

    const items = (await askCrafts(q, base.type, 3)).map(x => webItem(x, ''));
    const L = learn();
    items.sort((a, b) => scoreItem(b, L) - scoreItem(a, L));

  } catch (e) { draw([]); }
}

    case 'back': history.length > 1 ? history.back() : go({ v: 'home' }, true); break;
    case 'like': if (pin) { pin.liked = !pin.liked; await savePin(pin); thenClose(() => renderRoute(true)); if (pin.liked) toast('Added to favorites'); } break;
    case 'status': if (pin) { const made = el.dataset.s === 'made'; pin.status = made ? 'made' : 'want'; if (made) pin.madeAt = Date.now(); await savePin(pin); thenClose(() => renderRoute(true)); if (made) toast('Nice! Marked as made.'); } break;
    case 'move': if (pin) { pin.type = pin.type === 'craft' ? 'painting' : 'craft'; const s = Cats.sortPost({ title: pin.title, caption: pin.caption, url: pin.url }); pin.category = s[pin.type] || 'other'; await savePin(pin); thenClose(() => renderRoute(true)); toast('Moved to ' + (pin.type === 'craft' ? 'Crafts' : 'Painting') + ' · ' + Cats.catLabel(pin.type, pin.category), 'Change', () => openEdit(pin)); } break;
    case 'edit': if (pin) openEdit(pin); break;
    case 'delete': if (pin) {
      if (el.dataset.arm) { await deletePin(pin); closeSheet(() => { if (S.route.v === 'pin') history.back(); else renderRoute(true); }); }
      else { el.dataset.arm = '1'; el.lastChild.textContent = 'Tap again to delete'; }
    } break;
    case 'share': if (pin) thenClose(() => sharePin(pin.title, pin.url || pin.link)); break;
    case 'open': if (pin) { pin.opens = (pin.opens || 0) + 1; pin.lastOpened = Date.now(); savePin(pin); } break;
    case 'play': if (pin) { const em = embedOf(pin); const box = $('#cumedia'); if (em && box) { const w = box.clientWidth; box.innerHTML = `<div class="cu-top"><button class="round" data-act="back" aria-label="Back">${I(IC.back)}</button></div><iframe src="${esc(em.src)}" style="height:${Math.round(Math.min(w * em.ar, window.innerHeight * 0.8))}px" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(pin.title)}"></iframe>`; pin.opens = (pin.opens || 0) + 1; savePin(pin); } } break;
    case 'cap-more': { const c = $('#cap'); if (c) { c.classList.toggle('clip'); el.textContent = c.classList.contains('clip') ? 'More' : 'Less'; } } break;
    case 'tag': go({ v: 'search' }); runSearch(el.dataset.t); $('#q') && ($('#q').value = el.dataset.t); break;
    case 'topic': S.ideas.topic = el.dataset.t; S.ideas.items = []; S.ideas.sig = ''; S.ideas.error = ''; S.ideas.page = 1; renderRoute(); loadIdeas(true); break;
    case 'ideas-more': loadIdeas(false, true); break;
    case 'ideas-retry': loadIdeas(true); break;
    case 'tile': { const t = el.dataset.type, c = el.dataset.c; const q = catQuery(t, c); $('#q').value = Cats.catLabel(t, c); runSearch(q, S.pins.some(p => p.type === t && p.category === c) ? t + ':' + c : ''); window.scrollTo(0, 0); } break;
    case 'board': go({ v: 'board', key: el.dataset.key, from: 'saved' }); break;
    case 'board-sort': S.boardSort = el.dataset.s; renderRoute(true); break;
    case 'unavoid': if (el.dataset.k === 'tag') delete S.taste.avoidTags[el.dataset.v]; else delete S.taste.avoidCats[el.dataset.v]; saveTaste(); renderRoute(true); break;
    case 'backup': backup(); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'close-sheet': closeSheet(); break;
    case 'f-type': if (F) { F.type = el.dataset.t; F.touched = true; const g = F.guess || Cats.sortPost({ title: F.title, caption: F.caption, url: F.url }); F.category = g[F.type] || 'other'; renderSave(); } break;
    case 'f-cat': if (F) { F.category = el.dataset.c; F.touched = true; renderSave(); } break;
    case 'f-tag': if (F) { F.tags.push(el.dataset.t); F.suggested = F.suggested.filter(t => t !== el.dataset.t); renderSave(); } break;
    case 'f-untag': if (F) { F.tags = F.tags.filter(t => t !== el.dataset.t); renderSave(); } break;
    case 'f-save': saveForm(); break;
    case 'f-delete': if (F) {
      if (!F.delArm) { F.delArm = 1; renderSave(); }
      else { const p = S.pins.find(x => x.id === F.id); if (p) await deletePin(p); closeSheet(() => { if (S.route.v === 'pin') history.back(); else renderRoute(true); }); }
    } break;
  }
});
for (const b of $$('#nav button')) b.addEventListener('click', () => { if (!$('#sheetwrap').hidden) closeSheet(() => goTab(b.dataset.tab)); else goTab(b.dataset.tab); });
document.addEventListener('input', e => { if (e.target.id === 'q') runSearch(e.target.value); });
async function deletePin(p) {
  S.pins = S.pins.filter(x => x.id !== p.id);
  await DB.del('pins', p.id).catch(() => {});
  await DB.del('photos', p.id).catch(() => {});
  toast('Idea deleted');
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, action, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2800);
}

/* ---------- backup ---------- */
async function backup() {
  const photos = {};
  for (const p of S.pins) if (p.photo) {
    const b = await DB.get('photos', p.id).catch(() => null);
    if (b) photos[p.id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(''); fr.readAsDataURL(b); });
  }
  const data = { app: 'brushglue', v: 1, at: new Date().toISOString(), pins: S.pins, taste: S.taste, dismissed: Array.from(S.dismissed), photos };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'brush-and-glue-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded (' + plural(S.pins.length, 'idea') + ')');
}
$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch (err) { toast('That file isn’t a Brush & Glue backup.'); return; }
  if (!d || d.app !== 'brushglue' || !Array.isArray(d.pins)) { toast('That file isn’t a Brush & Glue backup.'); return; }
  let added = 0;
  for (const p of d.pins) {
    const cur = S.pins.find(x => x.id === p.id);
    if (cur && (cur.updatedAt || 0) >= (p.updatedAt || 0)) continue;
    if (d.photos && d.photos[p.id]) { try { const b = await (await fetch(d.photos[p.id])).blob(); await DB.put('photos', b, p.id); photoURLs.delete(p.id); p.photo = true; } catch (err) { p.photo = false; } }
    else p.photo = false;
    await DB.put('pins', p).catch(() => {});
    if (cur) Object.assign(cur, p); else { S.pins.push(p); added++; }
  }
  if (d.taste) { S.taste = Object.assign({ avoidTags: {}, avoidCats: {}, views: {} }, d.taste); saveTaste(); }
  if (Array.isArray(d.dismissed)) { d.dismissed.forEach(u => S.dismissed.add(u)); kvSet('dismissed', Array.from(S.dismissed)); }
  S.pins.sort((a, b) => b.createdAt - a.createdAt);
  renderRoute(true);
  toast('Restored ' + plural(added, 'new idea'));
});

/* ---------- start ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (['home', 'saved'].includes(S.route.v)) renderRoute(true); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Installed. Look for Brush & Glue in the Share menu.'); renderRoute(true); });

async function init() {
  const qs = new URLSearchParams(location.search);
  const shared = { url: qs.get('url') || '', text: qs.get('text') || '', title: qs.get('title') || '' };
  const start = qs.get('go') === 'ideas' ? { v: 'ideas' } : { v: 'home' };
  history.replaceState(start, '', location.pathname);
  S.route = start;
  renderRoute();
  const ok = await DB.open();
  const [pins, taste, dismissed] = await Promise.all([DB.all('pins').catch(() => []), kvGet('taste').catch(() => null), kvGet('dismissed').catch(() => null)]);
  S.pins = (pins || []).sort((a, b) => b.createdAt - a.createdAt);
  if (taste) S.taste = Object.assign({ avoidTags: {}, avoidCats: {}, views: {} }, taste);
  if (Array.isArray(dismissed)) S.dismissed = new Set(dismissed);
  S.ready = true;
  renderRoute();
  if (!ok) toast('This browser won’t let the app save. Ideas will be lost when you close it.');
  if (findUrl(shared.url) || findUrl(shared.text) || findUrl(shared.title) || shared.text) openSave(shared);
  else if (qs.has('add')) openSave({});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
init();
})();
</script>
