<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artistry</title>
<meta name="description" content="Save painting, craft and music ideas from Instagram, TikTok, YouTube, Facebook, Pinterest and any website. Artistry sorts them, finds the supplies, and learns what you like.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo-128.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/poppins-bold.woff" as="font" type="font/woff" crossorigin>
<style>
/* Artistry: a personal studio for art, craft and music projects.
   Colors come from the app icon (teal tile, coral and sun paint dabs, cobalt, mint, the plum of the music notes).
   Poppins for headings and buttons, the phone's own font for reading. The one loud thing is the painted rings. */
@font-face{font-family:Poppins;src:url(fonts/poppins-medium.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-bold.woff) format("woff");font-weight:700;font-display:swap}
:root{
  --paper:#ffffff; --ink:#17201e; --ink-2:#4b5754; --ink-3:#7c8885;
  --mist:#eef3f1; --mist-2:#dfe8e5; --line:#e3e9e7; --sheet:#ffffff; --scrim:rgba(12,22,20,.46);
  --teal:#0b7a72; --on-teal:#ffffff; --teal-soft:#dcf0ec;
  --coral:#ff4d5e; --coral-press:#e2374a; --on-coral:#ffffff; --coral-soft:#ffe4e7;
  --sun:#ffb51f; --sun-ink:#7a4d00; --sun-soft:#fff1cf;
  --cobalt:#2e62f0; --cobalt-soft:#e3eaff;
  --mint:#0f9d74; --mint-soft:#dbf3ea;
  --plum:#8a3fd6; --plum-soft:#efe4fb; --on-plum:#ffffff;
  --display:Poppins, ui-sans-serif, system-ui, sans-serif;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gut:12px; --nav-h:64px; --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0f1513; --ink:#e8f0ed; --ink-2:#a9b7b3; --ink-3:#7f8d89;
    --mist:#1a2422; --mist-2:#263230; --line:#21302c; --sheet:#151d1b; --scrim:rgba(0,0,0,.62);
    --teal:#3ec4b6; --on-teal:#06201d; --teal-soft:#13393a;
    --coral:#ff6b79; --coral-press:#ff8a95; --on-coral:#2a0a0e; --coral-soft:#3e1d22;
    --sun:#ffc54d; --sun-ink:#ffe0a0; --sun-soft:#3a2d10;
    --cobalt:#89a5ff; --cobalt-soft:#1c2648;
    --mint:#3cd2a3; --mint-soft:#123a30;
    --plum:#c69cff; --plum-soft:#2c2140; --on-plum:#1d1030;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;text-rendering:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-style:normal;line-height:1}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

#main{max-width:1180px;margin:0 auto;padding:0 var(--gut) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 36px)}

/* top of a tab */
.top{position:sticky;top:0;z-index:20;background:var(--paper);margin:0 calc(-1 * var(--gut));padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut) 6px}
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar .grow{flex:1;min-width:0}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em}
.mark img{width:32px;height:32px;border-radius:9px;display:block}
.pagehead{padding:calc(env(safe-area-inset-top,0px) + 12px) 2px 4px}
.pagehead h1{margin:0;font-size:27px;line-height:1.15}
.pagehead p{margin:4px 0 0;color:var(--ink-2)}
h2.sect{font-size:19px;margin:26px 2px 10px;display:flex;align-items:baseline;gap:10px}
h2.sect .more{margin-left:auto;font-family:var(--font);font-size:14px;font-weight:600;color:var(--teal);border:0;background:none;padding:4px 0;text-decoration:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink);position:relative;flex:none;text-decoration:none}
.iconbtn:active{background:var(--mist)}
.iconbtn.on{color:var(--coral)}
.iconbtn.on .ic{fill:currentColor}
.count{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:var(--on-coral);font:700 11px/18px var(--font);text-align:center}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;margin:0 calc(-1 * var(--gut));padding-left:var(--gut);padding-right:var(--gut);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--mist);border-radius:999px;padding:9px 15px;font:500 14px var(--display);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip .emo{font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* the painted rings (stories) */
.stories{display:flex;gap:14px;overflow-x:auto;margin:2px calc(-1 * var(--gut)) 4px;padding:6px var(--gut) 4px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:78px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;color:var(--ink)}
.ring{position:relative;width:74px;height:74px;display:grid;place-items:center}
.ring svg.paint{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .in{width:62px;height:62px;border-radius:50%;background:var(--mist);display:grid;place-items:center;overflow:hidden;font-size:30px;border:2px solid var(--paper)}
.ring .in img{width:100%;height:100%;object-fit:cover;display:block}
.ring .in.add{background:var(--teal-soft);color:var(--teal)}
.ring .in.letter{font:700 24px var(--display);color:#fff}
.ring .tag{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:var(--sun);color:#3d2700;font:700 10.5px/1 var(--font);padding:3px 6px;border-radius:999px;border:2px solid var(--paper);white-space:nowrap}
.story b{font:500 11.5px/1.15 var(--display);max-width:78px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.story.one b{display:block;white-space:nowrap;text-overflow:ellipsis}
.story small{font-size:11px;color:var(--ink-3);margin-top:-4px}

/* masonry of project cards */
.masonry{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.pin{position:relative;cursor:pointer;min-width:0}
.media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--mist)}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.media.ph{display:flex;align-items:flex-end;padding:14px 12px;font:700 17px/1.2 var(--display);overflow-wrap:anywhere}
.ph.painting{background:var(--cobalt-soft);color:var(--cobalt)}
.ph.craft{background:var(--teal-soft);color:var(--teal)}
.ph.music{background:var(--plum-soft);color:var(--plum)}
.plat{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.plat .ic{width:15px;height:15px}
.play{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.play .ic{width:12px;height:12px}
.stamp{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);color:#17201e;border-radius:999px;padding:4px 9px 4px 7px;font:700 11.5px/1 var(--font);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.stamp .ic{width:13px;height:13px;stroke-width:3}
.stamp.made{background:var(--mint);color:#fff}
.stamp.making{background:var(--sun);color:#3d2700}
.heart{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--coral);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.heart .ic{width:15px;height:15px}
.pin-foot{display:flex;align-items:flex-start;gap:2px;padding:7px 0 0 3px}
.pin-text{flex:1;min-width:0}
.pin-title{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pin-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--ink-3)}
.need{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-weight:700;font-size:11.5px;background:var(--sun-soft);color:var(--sun-ink)}
.need.ok{background:var(--mint-soft);color:var(--mint)}
.need .ic{width:12px;height:12px;stroke-width:3}
.holi{font-size:13px}
.dots{border:0;background:none;width:30px;height:26px;display:grid;place-items:center;border-radius:13px;flex:none;color:var(--ink-2)}
.dots .ic{width:19px;height:19px}
.save-pill{position:absolute;right:8px;top:8px;border:0;border-radius:999px;background:var(--coral);color:var(--on-coral);font:700 13.5px var(--display);padding:8px 13px}
.save-pill.done{background:var(--ink);color:var(--paper)}
.why{font-size:12px;color:var(--teal);font-weight:600}
.skel{border-radius:var(--r);background:var(--mist);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}

/* horizontal rows */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.tcard{flex:0 0 150px;cursor:pointer;scroll-snap-align:start;min-width:0}
.tcard .media{aspect-ratio:4/5}
.tcard b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.3;margin-top:6px}

/* cards with a tint */
.card{margin:12px 0;padding:16px;border-radius:22px;background:var(--mist)}
.card h3{margin:0 0 4px;font-size:16.5px}
.card p{margin:0}
.card.sun{background:var(--sun-soft)}
.card.mint{background:var(--mint-soft)}
.card.teal{background:var(--teal-soft)}
.memory{display:flex;gap:14px;align-items:center}
.memory .thumb{width:84px;height:104px;border-radius:14px;overflow:hidden;flex:none;background:var(--mist-2);cursor:pointer}
.memory .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.memory .txt{flex:1;min-width:0}
.memory small{display:block;color:var(--sun-ink);font-weight:700;font-size:12.5px;margin-bottom:2px}
.memory b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 15.5px/1.25 var(--display)}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;font:500 15.5px var(--display);text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn .ic{width:20px;height:20px}
.btn.coral{background:var(--coral);color:var(--on-coral)}
.btn.coral:active{background:var(--coral-press)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.gray{background:var(--mist)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--mist-2)}
.btn.sm{height:38px;padding:0 15px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:0;font-weight:700;color:var(--teal);text-decoration:none}
.note{margin:12px 0;padding:13px 15px;border-radius:16px;background:var(--mist);font-size:14px;color:var(--ink-2)}
.center{text-align:center}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--mist-2);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loadrow{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;color:var(--ink-2)}

/* welcome */
.welcome{margin:10px 0;padding:22px 18px;border-radius:26px;background:var(--teal-soft)}
.welcome h2{margin:0 0 4px;font-size:23px}
.welcome p{margin:0 0 14px;color:var(--ink-2)}
.namefield{display:flex;gap:8px;margin:0 0 16px}
.namefield input{flex:1;min-width:0;height:48px;border:0;border-radius:999px;padding:0 18px;background:var(--paper);font-size:16px;outline:none}
.steps{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font:700 13px var(--display)}

/* topic tiles: paint-dab shapes */
.dabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:14px 10px;margin-top:6px}
.dab{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);text-align:center}
.dab .blob{width:76px;height:70px;display:grid;place-items:center;font-size:32px}
.dab:nth-child(5n+1) .blob{background:var(--coral-soft);border-radius:58% 42% 55% 45% / 52% 60% 40% 48%}
.dab:nth-child(5n+2) .blob{background:var(--sun-soft);border-radius:45% 55% 40% 60% / 60% 45% 55% 40%}
.dab:nth-child(5n+3) .blob{background:var(--mint-soft);border-radius:62% 38% 50% 50% / 45% 55% 45% 55%}
.dab:nth-child(5n+4) .blob{background:var(--cobalt-soft);border-radius:50% 50% 38% 62% / 58% 42% 58% 42%}
.dab:nth-child(5n+5) .blob{background:var(--plum-soft);border-radius:40% 60% 58% 42% / 50% 50% 50% 50%}
.dab b{font:500 12.5px/1.2 var(--display)}
.dab small{font-size:11.5px;color:var(--ink-3);margin-top:-4px}

/* holiday cards */
.hcards{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 8px;scrollbar-width:none}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:0 0 152px;border:0;text-align:left;padding:14px;border-radius:22px;background:var(--sun-soft);color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:150px}
.hcard .emo{font-size:38px;margin-bottom:8px}
.hcard b{font:700 15.5px/1.2 var(--display)}
.hcard small{color:var(--sun-ink);font-weight:700;font-size:12.5px}
.hcard span{color:var(--ink-2);font-size:12.5px;margin-top:auto}

/* a project's own page */
.cu{max-width:680px;margin:0 auto}
.hero{position:relative;margin:0 calc(-1 * var(--gut));background:var(--mist);border-radius:0 0 28px 28px;overflow:hidden}
.hero img{display:block;width:100%;height:auto;max-height:76vh;object-fit:cover}
.hero.ph{min-height:300px;display:flex;align-items:flex-end;padding:26px 20px;font:700 26px/1.15 var(--display)}
.hero iframe{display:block;width:100%;border:0;background:#000}
.hero .float{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#17201e;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.22)}
.round .ic{width:22px;height:22px}
.playbig{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.playbig .ic{width:30px;height:30px;margin-left:3px}
.burst{position:absolute;inset:0;margin:auto;width:110px;height:110px;color:#fff;pointer-events:none;animation:burst .8s ease-out forwards;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
@keyframes burst{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}30%{transform:scale(.95)}70%{opacity:1}100%{transform:scale(1.15);opacity:0}}
.cu-body{padding:14px 2px 0}
.cu h1{font-size:25px;line-height:1.2;margin:0 0 10px;overflow-wrap:anywhere}
.by{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.by .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px var(--display);flex:none}
.by .who{flex:1;min-width:0}
.by b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by small{color:var(--ink-3);font-size:13px}
.react{display:flex;align-items:center;gap:4px;margin:12px -6px 2px}
.react .grow{flex:1}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--mist);border-radius:999px;margin:12px 0}
.seg3 button{border:0;background:none;border-radius:999px;height:42px;font:500 13.5px var(--display);padding:0 4px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2)}
.seg3 button .ic{width:17px;height:17px}
.seg3 button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg3 button[aria-pressed="true"][data-s="made"],.seg3 button[aria-pressed="true"][data-s="learned"]{background:var(--mint);color:#fff}
.seg3 button[aria-pressed="true"][data-s="making"],.seg3 button[aria-pressed="true"][data-s="learning"]{background:var(--sun);color:#3d2700}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;background:var(--mist);padding:8px 13px;font:500 13.5px var(--display);color:var(--ink);text-decoration:none}
.pill .ic{width:17px;height:17px}
.pill.sun{background:var(--sun-soft)}
.pill.sun small{color:var(--sun-ink);font:700 12px var(--font)}
.cap{white-space:pre-line;margin:0 0 6px;overflow-wrap:anywhere;color:var(--ink)}
.cap.clip{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mini{font:700 15px var(--display);margin:22px 0 8px}

/* supplies */
.sup{margin:16px 0;border-radius:22px;background:var(--mist);padding:16px 14px 10px}
.sup-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sup-head h3{margin:0;font-size:17px;flex:1}
.meter{height:8px;border-radius:4px;background:var(--mist-2);overflow:hidden;margin:2px 0 10px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--mint)}
.srows{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.srow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;border:0;background:none;text-align:left;width:100%;min-width:0;color:var(--ink)}
.srow:active{background:var(--mist-2)}
.tick{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--ink-3);color:transparent}
.tick .ic{width:15px;height:15px;stroke-width:3.2}
.srow.have .tick{background:var(--mint);box-shadow:none;color:#fff}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-weight:600;font-size:15px}
.srow .nm small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.have .nm b{color:var(--ink-2)}
.srow .gi{font-size:18px;width:24px;text-align:center}
.sup .likely{font-size:12.5px;color:var(--ink-3);margin:6px 4px 4px}
.sup .acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}

/* studio */

/* sheets */

.grip{width:40px;height:5px;border-radius:3px;background:var(--mist-2);margin:4px auto 10px}

.preview{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:20px;background:var(--mist)}

.preview .thumb img{width:100%;height:100%;object-fit:cover;display:block}

.boardpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:#17201e;color:#fff;border-radius:16px;padding:12px 14px 12px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px);width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* music (Learn music tab and lesson pages) */

.g-blues{background:#1d4ed8}.g-jazz{background:#9f1239}.g-folk{background:#4d7c0f}.g-gospel{background:#6d28d9}.g-latin{background:#dc2626}.g-movie{background:#475569}.g-holiday{background:#b91c1c}.g-other{background:#6b7280}

.psets .switch{padding:0}
.gauge{position:relative;max-width:340px;margin:14px auto 52px}
.gauge svg{display:block;width:100%;height:auto}
.gauge.off svg{opacity:.4}
#needle{transition:transform .12s ease-out}
.gnote{position:absolute;left:50%;top:89.3%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 5px var(--mist-2),0 6px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:box-shadow .15s}
.gnote b{font:700 46px/1 var(--display)}
.gnote sub{font:500 15px var(--display);color:var(--ink-3);margin:22px 0 0 1px}
.gnote.ok{box-shadow:0 0 0 7px var(--mint),0 6px 18px rgba(0,0,0,.12)}
.gnote.ok b{color:var(--mint)}
.gnote.lo{box-shadow:0 0 0 5px var(--cobalt),0 6px 18px rgba(0,0,0,.12)}
.gnote.hi{box-shadow:0 0 0 5px var(--coral),0 6px 18px rgba(0,0,0,.12)}
.thint{text-align:center;font:700 19px var(--display);margin:0 0 2px;min-height:26px}
.tfreq{text-align:center;color:var(--ink-3);font-size:13px;margin:0;min-height:18px;font-variant-numeric:tabular-nums}
.strings{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.strings button{width:50px;height:62px;border-radius:16px;border:0;background:var(--mist);display:grid;place-items:center;align-content:center;color:var(--ink)}
.strings b{font:700 20px/1.1 var(--display)}
.strings small{font-size:11px;color:var(--ink-3)}
.strings button.hear{background:var(--plum-soft);box-shadow:inset 0 0 0 2px var(--plum)}
.strings button[aria-pressed="true"]{background:var(--plum);color:var(--on-plum)}
.strings button[aria-pressed="true"] small{color:var(--on-plum)}
#prpill{position:fixed;left:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;display:flex;gap:6px}
#prpill button{border:0;background:var(--plum);color:var(--on-plum);border-radius:999px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font:500 14px var(--display);box-shadow:0 4px 14px rgba(0,0,0,.22)}
#prpill .ic{width:18px;height:18px}
#prpill .dot{width:9px;height:9px;border-radius:50%;background:var(--on-plum);animation:pulse 1.4s infinite}
#prpill .dot.paused{animation:none;opacity:.5}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){#prpill .dot{animation:none}#needle{transition:none}.beatdots i{transition:none}}
</style>
</head>
