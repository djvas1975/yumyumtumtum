<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artistry</title>
<meta name="description" content="Save painting and craft ideas from Instagram, TikTok, YouTube, Pinterest and any website.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo-128.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: a Pinterest-style board. Masonry of rounded photo pins, text tabs on top, five icons pinned to the bottom. */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#5f5f5f; --soft:#efefef; --soft-2:#e2e2e2; --line:#e6e6e6; --sheet:#ffffff;
  --red:#e60023; --red-press:#b3001b; --on-red:#ffffff; --ink:#111111; --on-ink:#ffffff;
  --ph-p:#e3e9fb; --ph-p-ink:#1f2f66; --ph-c:#dcefe5; --ph-c-ink:#124a36; --ph-m:#ece4fb; --ph-m-ink:#3b2470; --mu:#6d28d9;
  --scrim:rgba(0,0,0,.42);
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r:16px; --gap:8px; --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111111; --fg:#f1f1f1; --muted:#a8a8a8; --soft:#262626; --soft-2:#353535; --line:#2b2b2b; --sheet:#1c1c1c;
    --ink:#f1f1f1; --on-ink:#111111;
    --ph-p:#232c4d; --ph-p-ink:#d1dbff; --ph-c:#1a392d; --ph-c-ink:#bcecd7; --ph-m:#2e2448; --ph-m-ink:#ddd0ff; --mu:#c4b5fd;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #0074e8;outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

#main{max-width:1280px;margin:0 auto;padding:0 10px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}

/* top of each tab */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -10px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 4px}
.tabs{display:flex;justify-content:center;gap:26px}
.tabs button{border:0;background:none;font-weight:700;font-size:16px;padding:10px 2px 12px;position:relative;color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:3px;border-radius:2px;background:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--soft);border-radius:999px;padding:10px 15px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pagehead{padding:calc(env(safe-area-inset-top,0px) + 14px) 4px 6px}
.pagehead h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.pagehead p{margin:4px 0 0;color:var(--muted)}
h2.sect{font-size:20px;font-weight:800;margin:26px 4px 8px;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* masonry of pins */
.masonry{display:flex;gap:var(--gap);align-items:flex-start;margin-top:6px}
.mcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.pin{position:relative;cursor:pointer;min-width:0}
.pin-media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.pin-media img{display:block;width:100%;height:100%;object-fit:cover}
.pin-media.ph{display:flex;align-items:flex-end;padding:14px 12px;font-weight:800;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.pin-media.ph.painting{background:var(--ph-p);color:var(--ph-p-ink)}
.pin-media.ph.craft{background:var(--ph-c);color:var(--ph-c-ink)}
.pin-media.ph.music{background:var(--ph-m);color:var(--ph-m-ink)}
.pin-foot{display:flex;align-items:flex-start;gap:2px;padding:6px 0 0 4px}
.pin-text{flex:1;min-width:0}
.pin-title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pin-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dots{border:0;background:none;width:30px;height:24px;display:grid;place-items:center;border-radius:12px;flex:none;color:var(--fg)}
.dots .ic{width:20px;height:20px}
.badge{position:absolute;display:grid;place-items:center;border-radius:999px}
.badge.play{left:8px;top:8px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff}
.badge.play .ic{width:14px;height:14px}
.badge.fav{right:8px;bottom:8px;width:30px;height:30px;background:#fff;color:#e60023;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.badge.fav .ic{width:17px;height:17px}
.badge.made{left:8px;bottom:8px;padding:4px 9px 4px 7px;background:#fff;color:#111;font-size:12px;font-weight:700;gap:3px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.badge.made .ic{width:14px;height:14px;stroke-width:3}
.badge.made.mst{left:auto;bottom:auto;right:8px;top:8px}
.save-pill{position:absolute;right:8px;top:8px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:9px 14px}
.save-pill.done{background:#111;color:#fff}
.skel{border-radius:var(--r);background:var(--soft);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}

/* empty / welcome */
.welcome{margin:16px 4px 6px;padding:22px 18px;border-radius:24px;background:var(--soft)}
.welcome h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.welcome p{margin:0 0 12px;color:var(--muted)}
.steps{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.btn .ic{width:20px;height:20px}
.btn.red{background:var(--red);color:var(--on-red)}
.btn.red:active{background:var(--red-press)}
.btn.gray{background:var(--soft);color:var(--fg)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.sm{height:38px;padding:0 15px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.note{margin:10px 4px;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:14px;color:var(--muted)}
.center{text-align:center}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--soft-2);border-top-color:var(--red);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loadrow{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;color:var(--muted)}

/* pin page */
.cu{max-width:640px;margin:0 auto}
.cu-media{position:relative;border-radius:28px;overflow:hidden;background:var(--soft);margin:calc(env(safe-area-inset-top,0px) + 8px) -2px 0}
.cu-media img{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover}
.cu-media.ph{min-height:260px;display:flex;align-items:flex-end;padding:24px;font-size:26px;font-weight:800;line-height:1.15}
.cu-media.ph.painting{background:var(--ph-p);color:var(--ph-p-ink)}
.cu-media.ph.craft{background:var(--ph-c);color:var(--ph-c-ink)}
.cu-media iframe{display:block;width:100%;border:0;background:#000}
.cu-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.22)}
.round .ic{width:22px;height:22px}
.playbig{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.playbig .ic{width:30px;height:30px}
.cu-actions{display:flex;align-items:center;gap:6px;padding:12px 2px 4px}
.cu-actions .grow{flex:1}
.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
.iconbtn.on{color:var(--red)}
.iconbtn.on .ic{fill:currentColor}
.cu-body{padding:4px 6px 0}
.by{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.pdot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.by b{display:block;font-size:15px}
.by small{color:var(--muted);font-size:13px}
.cu h1{font-size:26px;line-height:1.2;font-weight:800;margin:4px 0 8px;letter-spacing:-.01em;overflow-wrap:anywhere}
.cap{white-space:pre-line;margin:0 0 6px;overflow-wrap:anywhere}
.cap.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.boardrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.bpill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--soft);padding:9px 14px;font-weight:700;font-size:14px}
.bpill .ic{width:18px;height:18px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--soft);border-radius:999px;margin:12px 0}
.seg2 button{border:0;background:none;border-radius:999px;height:40px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.taglist button,.taglist span{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.minihead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.sup{margin:0;padding-left:20px}
.sup li{margin:3px 0}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:18px 10px;margin-top:10px}
.board{cursor:pointer;min-width:0}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1.45/1;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.collage > div{background:var(--soft-2);min-width:0;min-height:0}
.collage > div:first-child{grid-row:1 / span 2}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.board b{display:block;margin:7px 2px 0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board small{display:block;margin:0 2px;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:1.7/1;background:var(--soft);text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.tile.painting{background:var(--ph-p)}
.tile.craft{background:var(--ph-c)}
.tile.noimg span{background:none;color:var(--fg)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0}
.split i{display:block;height:100%}
.searchbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--soft);color:var(--muted)}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--fg);height:100%}
.searchbar input::placeholder{color:var(--muted)}
.panel{margin:10px 0;padding:16px;border-radius:20px;background:var(--soft)}
.panel h3{margin:0 0 6px;font-size:16px}
.sharecard{display:flex;align-items:center;gap:12px}
.sharecard>div{flex:1;min-width:0}
.sharecard p{margin:0;font-size:13.5px;line-height:1.35}

/* bottom icons */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:2px 6px env(safe-area-inset-bottom,0px)}
#nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{border:0;background:none;color:var(--muted);height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600}
#nav button[aria-current="page"]{color:var(--fg)}
#nav button[aria-current="page"] .ic{stroke-width:2.7}
#nav .ic{width:26px;height:26px}

/* sheets */
#sheetwrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:640px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:720px){#sheetwrap{align-items:center}#sheet{border-radius:26px;max-height:92%}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--soft-2);margin:4px auto 8px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.shead h2{margin:0;font-size:20px;font-weight:800}
.field{display:grid;gap:6px;margin-top:14px}
.field > label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea{width:100%;min-width:0;border:2px solid transparent;border-radius:16px;background:var(--soft);padding:12px 14px;font-size:16px;color:var(--fg);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--soft-2)}
.field textarea{resize:vertical;min-height:70px}
.preview{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:18px;background:var(--soft)}
.preview .thumb{width:74px;height:92px;border-radius:12px;overflow:hidden;flex:none;background:var(--soft-2)}
.preview .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.preview .ptext{min-width:0;flex:1}
.preview .ptext b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.preview small{color:var(--muted);font-size:13px}
.boardpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boardpick button{height:54px;border-radius:16px;border:2px solid var(--soft-2);background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;padding:0 4px}
.boardpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.boardpick.ask button{border-color:var(--red)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:0;background:var(--soft);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px}
.catpick button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.hint.bad{color:var(--red)}
.sactions{display:flex;gap:8px;margin-top:18px}
.sactions .btn{flex:1}
.menu{display:grid;gap:2px;margin-top:4px}
.menu button{display:flex;align-items:center;gap:14px;border:0;background:none;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:600;text-align:left}
.menu button:active{background:var(--soft)}
.menu button.danger{color:var(--red)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:#111;color:#fff;border-radius:16px;padding:12px 14px 12px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 24px);width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:#fff;color:#111;border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}

/* Learn music */
.mu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 4px 10px}
.mu-head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.mu-head p{margin:3px 0 0;color:var(--muted);font-size:14px}
.mu-head p b{color:var(--mu)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:18px 10px;margin-top:6px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -10px;padding:2px 10px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.vcard{cursor:pointer;min-width:0}
.vcard.h{flex:0 0 210px}
.vthumb{position:relative;border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:16/9}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb.stile{display:flex;align-items:flex-end;gap:6px;padding:10px;color:#fff;font-weight:800;font-size:15px;line-height:1.2}
.vthumb.stile .ic{position:absolute;right:10px;top:10px;width:22px;height:22px;opacity:.85}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px}
.vsaved{position:absolute;left:6px;top:6px;background:#111;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.vtitle{font-size:14px;font-weight:700;line-height:1.3;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vsub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vwhy{font-size:12px;color:var(--mu);font-weight:700;margin-top:3px}
.slist{display:grid;gap:2px;margin-top:4px}
.srow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:14px;cursor:pointer}
.srow:active{background:var(--soft)}
.sbadge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.sbadge .ic{width:22px;height:22px}
.stext{flex:1;min-width:0}
.stext b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stext small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stext em{display:block;font-style:normal;color:var(--mu);font-size:12px;font-weight:700}
.sadd{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--fg)}
.sadd .ic{width:20px;height:20px}
.sadd.on{background:var(--ink);color:var(--on-ink)}
.g-alternative{background:#5b5bd6}.g-rock{background:#c2410c}.g-classical{background:#8a6d3b}.g-pop{background:#db2777}.g-rap{background:#334155}
.g-classicrock{background:#b45309}.g-oldies{background:#0e7490}.g-motown{background:#7c3aed}.g-country{background:#a16207}.g-bluegrass{background:#15803d}
.g-blues{background:#1d4ed8}.g-jazz{background:#9f1239}.g-folk{background:#4d7c0f}.g-gospel{background:#6d28d9}.g-latin{background:#dc2626}.g-movie{background:#475569}.g-holiday{background:#b91c1c}.g-other{background:#6b7280}
.tch{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--soft);text-decoration:none;max-width:260px}

<script>
(() => {

function platformOf(url) {

  if (/(^|\.)tiktok\.com$/.test(h)) return 'tiktok';

  const m = t.match(/https?:\/\/[^\s<>"']+/i) || t.match(/\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|it|be|me|watch|co|us|io|app|tv|ly|uk)\/[^\s<>"']*/i);
  return m ? m[0].replace(/[),.!?'"]+$/, '') : '';
}
function normUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) && x.hostname.includes('.') ? x.href : ''; } catch (e) { return ''; }
}
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 30000);

    const r = await fetch(url, { signal: ctl.signal });

}
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- storage on the phone (IndexedDB) ---------- */
const DB = {
  db: null, mem: { pins: new Map(), photos: new Map(), kv: new Map() },
  open() {
    return new Promise(res => {
      let r;
      // the storage keeps the old name (the app was Brush & Glue until Oct 1, 2026) so nothing saved is lost
      try { r = indexedDB.open('brushglue', 1); } catch (e) { res(false); return; }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('pins', { keyPath: 'id' }); d.createObjectStore('photos'); d.createObjectStore('kv'); };

  req(store, mode, fn) {

  put(store, val, key) {
    if (!this.db) { this.mem[store].set(key === undefined ? val.id : key, val); return Promise.resolve(); }
    return this.req(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key));
  },
  del(store, key) { if (!this.db) { this.mem[store].delete(key); return Promise.resolve(); } return this.req(store, 'readwrite', s => s.delete(key)); }

const kvGet = k => DB.get('kv', k);
const kvSet = (k, v) => DB.put('kv', v, k).catch(() => {});

/* ---------- state ---------- */
const S = {
  pins: [],
  taste: { avoidTags: {}, avoidCats: {}, views: {} },
  dismissed: new Set(),
  route: { v: 'home' },
  homeTab: 'all', homeCat: 'all',
  boardSort: 'new',
  ideas: { items: [], topic: 'foryou', loading: false, error: '', at: 0, sig: '', page: 1 },
  more: new Map(),      // "more like this" answers by search
  web: new Map(),       // idea cards on screen: key -> item
  search: { q: '', cat: '', results: [], loading: false, error: '' },
  installEvt: null,
  ready: false
};
function savePin(p) { p.updatedAt = Date.now(); return DB.put('pins', p).catch(() => toast('Couldn’t save on this phone. Is its storage full?')); }
function saveTaste() { kvSet('taste', S.taste); }

/* ---------- photos: kept on the phone so they never expire ---------- */
const photoURLs = new Map();
async function photoURL(id) {
  if (photoURLs.has(id)) return photoURLs.get(id);
  const blob = await DB.get('photos', id).catch(() => null);
  if (!blob) return '';
  const u = URL.createObjectURL(blob);
  photoURLs.set(id, u);
  return u;
}
async function shrink(blob) {
  let src, w, h;
  try { src = await createImageBitmap(blob); w = src.width; h = src.height; }
  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  if (!w || !h) throw new Error('empty image');
  const sc = Math.min(1, 736 / w);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  return { blob: out || blob, w: cv.width, h: cv.height };
}
async function fetchPhoto(url) {
  if (!url) return null;
  for (const u of [API + '/api/image?url=' + enc(url), url]) {
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      const b = await r.blob();
      if (!/^image\//.test(b.type)) continue;
      return await shrink(b);
    } catch (e) { /* try the next way */ }
  }
  return null;
}
function hydrate(root) {
  for (const img of $$('img[data-photo]', root || document)) {
    const id = img.dataset.photo;
    img.removeAttribute('data-photo');
    photoURL(id).then(u => { if (u) img.src = u; else if (img.dataset.orig) { img.src = img.dataset.orig; img.dataset.proxy = '1'; } });
  }
}
// a web photo that won't load directly: try it through the photo helper once, then show the title instead
document.addEventListener('error', e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || !im.dataset.proxy) return;
  if (im.dataset.proxy === '1' && im.dataset.orig) { im.dataset.proxy = '2'; im.src = API + '/api/image?url=' + enc(im.dataset.orig); return; }

  im.remove();
  if (!box) return;
  if (box.classList.contains('pin-media')) { box.classList.add('ph', box.dataset.type || 'painting'); const s = document.createElement('span'); s.textContent = box.dataset.title || ''; box.prepend(s); }
  else if (box.classList.contains('tile')) box.classList.add('noimg');
  else if (box.classList.contains('cu-media')) { box.classList.add('ph', box.dataset.type || 'painting'); box.style.minHeight = '220px'; }
}, true);

/* ---------- what it learns ---------- */
const GENERIC_TAGS = new Set(['easy', 'kids', 'gift', 'diy', 'craft', 'crafts', 'painting', 'art']);
const weightOf = p => p.example ? 0 : 1 + (p.liked ? 3 : 0) + (p.status === 'made' ? 2 : 0) + Math.min(p.opens || 0, 4) * 0.5;
function learn() {
  const cat = {}, catN = {}, tag = {}, type = { painting: 0, craft: 0 };
  let n = 0, liked = 0, made = 0;
  for (const p of S.pins) {
    if (p.example || p.type === 'music') continue;
    n++; if (p.liked) liked++; if (p.status === 'made') made++;
    const w = weightOf(p), ck = p.type + ':' + p.category;
    type[p.type] += w;
    cat[ck] = (cat[ck] || 0) + w; catN[ck] = (catN[ck] || 0) + 1;
    for (const t of p.tags || []) tag[t] = (tag[t] || 0) + w;
  }
  for (const [k, v] of Object.entries(S.taste.views || {})) cat[k] = (cat[k] || 0) + Math.min(v, 6) * 0.3;
  for (const [t, c] of Object.entries(S.taste.avoidTags || {})) tag[t] = (tag[t] || 0) - 2 * c;
  for (const [k, c] of Object.entries(S.taste.avoidCats || {})) cat[k] = (cat[k] || 0) - 2 * c;

}
function scoreItem(it, L) {
  let s = (L.cat[it.type + ':' + it.category] || 0);
  for (const t of it.tags || []) s += 0.6 * (L.tag[t] || 0);
  const tot = L.type.painting + L.type.craft;
  if (tot) s += 1.5 * (L.type[it.type] || 0) / tot;

}
const topCats = (L, k) => Object.entries(L.cat).filter(([key, w]) => w > 0 && !key.endsWith(':other')).sort((a, b) => b[1] - a[1]).slice(0, k).map(([key]) => { const [type, id] = key.split(':'); return { type, id, key }; });
const topTags = (L, k) => Object.entries(L.tag).filter(([t, w]) => w > 0 && !GENERIC_TAGS.has(t)).sort((a, b) => b[1] - a[1]).slice(0, k).map(([t]) => t);

/* ---------- Ideas for you (painting and craft blogs, ranked on the phone) ---------- */
const CAT_Q = {
  painting: { acrylic: 'acrylic painting', watercolor: 'watercolor', pour: 'acrylic pour', rock: 'painted rocks', dot: 'dot mandala', objects: 'painted pumpkins', oil: 'oil painting', gouache: 'gouache', spray: 'spray paint', furniture: 'painted furniture', wall: 'mural', drawing: 'drawing', kids: 'painting for kids', other: 'painting' },
  craft: { wood: 'wood craft', paper: 'paper craft', resin: 'resin', cricut: 'cricut', sewing: 'sewing', yarn: 'crochet', jewelry: 'bracelet', clay: 'clay', candles: 'candle', florals: 'wreath', glass: 'stained glass', holiday: '', decor: 'home decor', kids: 'kids craft', upcycle: 'upcycle', diamond: 'diamond painting', other: 'craft' }
};
const SEASON = [['valentines', 'winter'], ['valentines', 'winter'], ['st patricks', 'spring'], ['easter', 'spring'], ['spring', 'mothers day'], ['summer', 'fathers day'], ['4th of july', 'summer'], ['summer', 'back to school'], ['fall', 'back to school'], ['halloween', 'fall'], ['thanksgiving', 'fall'], ['christmas', 'winter']];
function catQuery(type, id) {
  if (type === 'craft' && id === 'holiday') return SEASON[new Date().getMonth()][0] + ' craft';
  if (type === 'painting' && id === 'objects' && ![8, 9, 10].includes(new Date().getMonth())) return 'glass painting';

}
function ideaQueries(topic) {
  if (topic && topic !== 'foryou') {
    if (topic.startsWith('cat:')) { const [, type, id] = topic.split(':'); return [{ q: catQuery(type, id), type, reason: '' }]; }
    if (topic.startsWith('tag:')) return [{ q: topic.slice(4), type: 'both', reason: '' }];
    return [{ q: topic, type: 'both', reason: '' }];
  }
  const L = learn();
  const season = SEASON[new Date().getMonth()];
  const qs = [];
  for (const c of topCats(L, 3)) {
    const q = catQuery(c.type, c.id);
    if (q) qs.push({ q, type: c.type, reason: 'Because you like ' + Cats.catLabel(c.type, c.id) });
  }
  const tags = topTags(L, 2);
  if (tags[0]) {
    const lead = L.type.craft > L.type.painting ? 'craft' : 'painting';
    qs.push({ q: tags[0] + ' ' + lead, type: lead, reason: 'Because you save #' + tags[0] + ' ideas' });
  }
  qs.push({ q: season[0] + ' craft', type: 'craft', reason: 'For ' + titleCase(season[0]) });
  qs.push({ q: season[0] === 'fall' ? 'fall painting' : season[0] + ' painting', type: 'painting', reason: 'For ' + titleCase(season[0]) });
  if (qs.length < 5) for (const d of [{ q: 'acrylic painting', type: 'painting' }, { q: 'painted rocks', type: 'painting' }, { q: 'wood craft', type: 'craft' }, { q: 'watercolor', type: 'painting' }, { q: 'dollar tree craft', type: 'craft' }]) {
    if (qs.length >= 5) break;
    if (!qs.some(x => x.q === d.q)) qs.push(Object.assign({ reason: 'To get you started' }, d));
  }

}
function titleCase(s) { return String(s).replace(/\b\w/g, c => c.toUpperCase()); }
// the same project can show up under two addresses; its title gives it away
const tkey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const isSaved = it => S.pins.some(p => p.url === it.url || (p.source === 'ideas' && tkey(p.title) === tkey(it.title)));
function tasteSig() { return JSON.stringify(ideaQueries('foryou').map(q => q.q)); }
function webItem(x, reason) {
  const sorted = Cats.sortPost({ title: x.title, url: x.url });
  const type = sorted.type || (x.kind === 'painting' ? 'painting' : 'craft');
  return {
    key: x.url, url: x.url, title: x.title, image: x.image, width: x.width || 0, height: x.height || 0,
    sourceName: x.sourceName || hostOf(x.url), type, category: sorted.type === type ? sorted.category : (sorted[type] || 'other'),

async function askCrafts(q, type, n, page) {

async function loadIdeas(force, append) {

  const fresh = Date.now() - S.ideas.at < 6 * 3600e3;
  if (!force && !append) {
    if (S.ideas.sig === sig && fresh && (S.ideas.items.length || S.ideas.error)) return;
    if (topic === 'foryou') {
      const c = await kvGet('ideas').catch(() => null);
      if (c && c.sig === sig && Date.now() - c.at < 6 * 3600e3 && c.items && c.items.length) { Object.assign(S.ideas, { items: c.items, at: c.at, sig, error: '', page: c.page || 1 }); refreshIdeasViews(); return; }
    }
  }
  S.ideas.sig = sig; S.ideas.at = Date.now();
  if (!navigator.onLine) { S.ideas.error = 'You’re offline. New ideas need the internet.'; refreshIdeasViews(); return; }
  const page = append ? (S.ideas.page || 1) + 1 : 1;
  S.ideas.loading = true; S.ideas.error = '';
  refreshIdeasViews();
  const qs = ideaQueries(topic);
  const lists = await Promise.all(qs.map(q => askCrafts(q.q, q.type, topic === 'foryou' ? 3 : 6, page).then(items => items.map(x => webItem(x, q.reason))).catch(() => [])));
  const L = learn();
  const have = new Set(S.pins.map(p => p.url).concat(S.pins.map(p => p.link || '')).concat(S.pins.map(p => tkey(p.title))));
  lists.forEach(l => l.sort((a, b) => scoreItem(b, L) - scoreItem(a, L)));
  const out = append ? S.ideas.items.slice() : [], seen = new Set(out.map(x => x.url).concat(out.map(x => tkey(x.title))));
  const before = out.length;
  for (let i = 0; i < 40; i++) for (const l of lists) {
    const it = l[i];
    if (!it || seen.has(it.url) || seen.has(tkey(it.title)) || have.has(it.url) || have.has(tkey(it.title)) || S.dismissed.has(it.url)) continue;
    if ((S.taste.avoidCats[it.type + ':' + it.category] || 0) >= 2) continue;
    seen.add(it.url); seen.add(tkey(it.title)); out.push(it);
  }
  S.ideas.loading = false;
  if (out.length === before) {
    if (append) toast('That’s all the new ideas for now. Try a different topic.');
    else S.ideas.error = 'Couldn’t get new ideas right now. Try again in a minute.';
  } else {
    Object.assign(S.ideas, { items: out.slice(0, 160), page });

}
function refreshIdeasViews() {

/* ---------- masonry ---------- */
function colCount() {
  const w = Math.min(window.innerWidth, 1280) - 20;
  return w < 520 ? 2 : w < 800 ? 3 : w < 1080 ? 4 : 5;
}
function arOf(w, h) { return w && h ? Math.max(0.6, Math.min(1.9, h / w)) : 1.3; }
function masonry(items, card) {
  const n = colCount(), cols = Array.from({ length: n }, () => []), heights = new Array(n).fill(0);

    const ar = it.web ? arOf(it.width, it.height) : (it.img ? arOf(it.img.w, it.img.h) : (it.imageUrl ? 1.3 : 1.05));
    const k = heights.indexOf(Math.min(...heights));
    cols[k].push(card(it, ar));
    heights[k] += ar + 0.28;
  }
  return `<div class="masonry">${cols.map(c => `<div class="mcol">${c.join('')}</div>`).join('')}</div>`;
}
function pinCard(p, ar) {
  const t = p.type === 'craft' ? 'craft' : p.type === 'music' ? 'music' : 'painting';
  let media;
  if (p.photo) media = `<img data-photo="${esc(p.id)}" data-orig="${esc(p.imageUrl || '')}" alt="">`;
  else if (p.imageUrl) media = `<img src="${esc(p.imageUrl)}" data-orig="${esc(p.imageUrl)}" data-proxy="1" loading="lazy" referrerpolicy="no-referrer" alt="">`;
  const ph = !media;
  return `<div class="pin" data-act="open-pin" data-id="${esc(p.id)}">
    <div class="pin-media${ph ? ' ph ' + t : ''}" data-type="${t}" data-title="${esc(p.title)}" style="aspect-ratio:1/${ph ? 1.05 : ar}">${ph ? esc(p.title) : media}
      ${p.kind === 'video' ? `<span class="badge play">${I(IC.play, 'fill')}</span>` : ''}
      ${p.liked ? `<span class="badge fav">${I(IC.heart, 'fill')}</span>` : ''}
      ${p.status === 'made' ? `<span class="badge made">${I(IC.check)}Made it</span>` : ''}
      ${p.type === 'music' && (p.mstatus === 'learned' || p.mstatus === 'learning') ? `<span class="badge made mst">${p.mstatus === 'learned' ? I(IC.check) + 'Learned' : 'Learning'}</span>` : ''}
    </div>

      <button class="dots" data-act="pin-menu" data-id="${esc(p.id)}" aria-label="More options for ${esc(p.title)}">${I(IC.dots, 'fill')}</button></div>
  </div>`;
}
function ideaCard(it, ar) {
  S.web.set(it.key, it);
  const saved = isSaved(it);
  return `<div class="pin" data-act="open-idea" data-k="${esc(it.key)}">
    <div class="pin-media" data-type="${it.type}" data-title="${esc(it.title)}" style="aspect-ratio:1/${ar}">

function skeleton(n) {

const TABS = ['home', 'search', 'music', 'ideas', 'saved'];

function embedOf(p) {

    if (id) return { src: 'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0', ar: /shorts\//.test(u) ? 1.78 : 0.5625 };
  }
  if (p.platform === 'tiktok') {
    const id = (u.match(/\/(?:video|photo)\/(\d{8,})/) || [])[1];
    if (id) return { src: 'https://www.tiktok.com/embed/v2/' + id, ar: 1.78 };
  }
  if (p.platform === 'instagram') {
    const code = (u.match(/instagram\.com\/(?:[\w.]+\/)?(?:p|reels?|tv)\/([\w-]{5,})/i) || [])[1];
    if (code) return { src: 'https://www.instagram.com/p/' + code + '/embed/', ar: 1.62 };

async function loadMore(r) {

  const baseUrl = base.url;

    let s = 0;

    for (const t of p.tags || []) if ((base.tags || []).includes(t)) s += 1;
    return { p, s };
  }).filter(x => x.s >= 3).sort((a, b) => b.s - a.s).slice(0, 6).map(x => x.p);
  const tag = (base.tags || []).find(t => !GENERIC_TAGS.has(t) && t.length < 16);
  const q = [catQuery(base.type, base.category) || (base.type === 'craft' ? 'craft' : 'painting'), tag && !catQuery(base.type, base.category).includes(tag) ? tag : ''].join(' ').trim();

    if (w.length) h += (own.length ? `<div class="minihead" style="margin:18px 0 0 4px">From craft and painting blogs</div>` : '') + masonry(w, ideaCard);
    if (!h) h = `<div class="note">${navigator.onLine ? 'Nothing else like this yet.' : 'You’re offline. More ideas need the internet.'}</div>`;
    b.innerHTML = h;
    hydrate(b);
  };
  if (S.more.has(q)) { draw(S.more.get(q)); return; }
  if (own.length) draw(null);

    const items = (await askCrafts(q, base.type, 3)).map(x => webItem(x, ''));

// the player (YouTube's own embed, so speed and looping work)
let YTP = null, ytLoad = null, tick = 0, curV = null, loopA = null, loopB = null, watched = 0, watchEv = 0, wantRate = 1;
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytLoad) return ytLoad;
  ytLoad = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { if (prev) prev(); } catch (e) {} res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytLoad = null; rej(new Error('blocked')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { ytLoad = null; rej(new Error('slow')); } }, 12000);
  });
  return ytLoad;
}
async function playVideo(v) {
  const box = $('#player');
  if (!box) return;
  stopPlayer();
  curV = v; wantRate = 1;
  box.innerHTML = '<span class="spinner" style="position:absolute;inset:0;margin:auto"></span>';
  const p = savedVid(v.id);
  if (p) { p.opens = (p.opens || 0) + 1; p.lastOpened = Date.now(); savePin(p); }
  try {
    await loadYT();
    if (curV !== v || !$('#player')) return;
    $('#player').innerHTML = '<div id="ytp"></div>';
    YTP = new window.YT.Player('ytp', {
      videoId: v.id, width: '100%', height: '100%',
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, autoplay: 1 },
      events: {
        onReady: e => { try { e.target.playVideo(); if (wantRate !== 1) e.target.setPlaybackRate(wantRate); } catch (er) {} },
        onError: e => {
          if ([100, 101, 150, 153].includes(e.data) && $('#player')) $('#player').innerHTML = `<div class="pmsg">This video only plays on YouTube.<a class="btn red sm" href="${esc(v.url)}" target="_blank" rel="noopener">Open in YouTube</a></div>`;
        }
      }
    });
    tick = setInterval(practiceTick, 250);
  } catch (e) {
    if (curV !== v || !$('#player')) return;
    $('#player').innerHTML = `<iframe src="https://www.youtube.com/embed/${esc(v.id)}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title)}"></iframe>`;
    const pr = $('#practice'); if (pr) pr.hidden = true;
  }
}
function practiceTick() {
  if (!YTP || typeof YTP.getPlayerState !== 'function') return;
  let st, t;
  try { st = YTP.getPlayerState(); t = YTP.getCurrentTime(); } catch (e) { return; }
  if (loopA != null && loopB != null && t >= loopB) { try { YTP.seekTo(loopA, true); } catch (e) {} }
  if (st === 1 && curV) {
    watched += 0.25;
    if (watched >= 30 * (watchEv + 1) && watchEv < 8) {
      watchEv++;
      mEvent('watch', curV, 0.5);
      const p = savedVid(curV.id);
      if (p) { p.practiced = (p.practiced || 0) + 30; savePin(p); }
    }
  }
}
function stopPlayer() {
  clearInterval(tick); tick = 0;
  try { if (YTP && YTP.destroy) YTP.destroy(); } catch (e) {}
  YTP = null; curV = null; loopA = loopB = null; watched = 0; watchEv = 0;
}
function loopInfo() {
  const el = $('#loopinfo');
  if (!el) return;
  const f = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  el.textContent = loopA != null && loopB != null ? 'Looping ' + f(loopA) + ' to ' + f(loopB) : loopA != null ? 'Starts at ' + f(loopA) + '. Now tap End here.' : '';
}

    case 'v-speed': { const r = +el.dataset.r; wantRate = r; for (const b of $$('[data-act="v-speed"]')) b.setAttribute('aria-pressed', String(+b.dataset.r === r)); try { if (YTP && YTP.setPlaybackRate) YTP.setPlaybackRate(r); } catch (e) {} if (!YTP) toast('Tap play, then pick a speed.'); } return true;
    case 'v-loop-a': if (!YTP) { toast('Start the video first.'); return true; } try { loopA = YTP.getCurrentTime(); loopB = null; } catch (e) {} loopInfo(); return true;
    case 'v-loop-b': if (!YTP) { toast('Start the video first.'); return true; } try { const t = YTP.getCurrentTime(); if (loopA == null) { loopA = Math.max(0, t - 10); } loopB = t; if (loopB <= loopA) { const x = loopA; loopA = loopB; loopB = x; } if (loopB - loopA < 1) loopB = loopA + 1; YTP.seekTo(loopA, true); } catch (e) {} loopInfo(); return true;
    case 'v-loop-x': loopA = loopB = null; loopInfo(); return true;
    case 'v-status': if (v) { const st = el.dataset.s; await saveVideo(v, st); mEvent('status', v, STATUS_W[st]); if (st === 'learned') toast('Nice! Another one learned.'); refreshVideoBits(v); } return true;
    case 'v-save': if (v) { await saveVideo(v, 'want'); after(() => refreshVideoBits(v)); toast('Saved to your lessons'); } return true;
    case 'v-like': if (v) { const p = savedVid(v.id); if (p) { p.liked = !p.liked; await savePin(p); if (p.liked) mEvent('like', v, 3); refreshVideoBits(v); } } return true;
    case 'v-remove': if (v) { const p = savedVid(v.id); if (p) await deletePin(p); after(() => refreshVideoBits(v)); } return true;
    case 'v-share': if (v) after(() => sharePin(v.title, v.url)); return true;
    case 'v-menu': if (v) videoMenu(v); return true;
    case 'v-no': if (v) { MS.dismissed.add(v.id); saveMusic(); mEvent('no', v, -3); after(() => { if (S.route.v === 'video') history.back(); else renderRoute(true); }); toast('Got it. You’ll see fewer like that.'); } return true;
  }
  return false;
}
document.addEventListener('input', e => { if (e.target.id === 'mq') musicSearch(e.target.value); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'mq') { e.preventDefault(); musicSearch(e.target.value, true); e.target.blur(); } });


/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, action, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2800);
}

/* ---------- backup ---------- */
async function backup() {
  const photos = {};
  for (const p of S.pins) if (p.photo) {
    const b = await DB.get('photos', p.id).catch(() => null);
    if (b) photos[p.id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(''); fr.readAsDataURL(b); });
  }
  const data = { app: 'brushglue', v: 1, at: new Date().toISOString(), pins: S.pins, taste: S.taste, dismissed: Array.from(S.dismissed), music: { prefs: MS.prefs, events: MS.events, dismissed: Array.from(MS.dismissed), dismissedSongs: Array.from(MS.dismissedSongs) }, photos };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'artistry-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded (' + plural(S.pins.length, 'idea') + ')');
}
$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch (err) { toast('That file isn’t an Artistry backup.'); return; }
  if (!d || d.app !== 'brushglue' || !Array.isArray(d.pins)) { toast('That file isn’t an Artistry backup.'); return; }
  let added = 0;
  for (const p of d.pins) {
    const cur = S.pins.find(x => x.id === p.id);
    if (cur && (cur.updatedAt || 0) >= (p.updatedAt || 0)) continue;
    if (d.photos && d.photos[p.id]) { try { const b = await (await fetch(d.photos[p.id])).blob(); await DB.put('photos', b, p.id); photoURLs.delete(p.id); p.photo = true; } catch (err) { p.photo = false; } }
    else p.photo = false;
    await DB.put('pins', p).catch(() => {});
    if (cur) Object.assign(cur, p); else { S.pins.push(p); added++; }
  }
  if (d.taste) { S.taste = Object.assign({ avoidTags: {}, avoidCats: {}, views: {} }, d.taste); saveTaste(); }
  if (Array.isArray(d.dismissed)) { d.dismissed.forEach(u => S.dismissed.add(u)); kvSet('dismissed', Array.from(S.dismissed)); }
  if (d.music) loadMusicState(d.music, true);
  S.pins.sort((a, b) => b.createdAt - a.createdAt);
  renderRoute(true);
  toast('Restored ' + plural(added, 'new idea'));
});

/* ---------- start ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (['home', 'saved'].includes(S.route.v)) renderRoute(true); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Installed. Look for Artistry in the Share menu.'); renderRoute(true); });

function loadMusicState(m, merge) {
  if (m.prefs) {
    const insts = (m.prefs.insts || []).filter(i => Music.INSTRUMENTS.some(x => x.id === i));
    const genres = (m.prefs.genres || []).filter(g => Music.GENRES.some(x => x.id === g));
    MS.prefs = { insts: insts.length ? insts : Music.DEFAULT_INST.slice(), genres, level: m.prefs.level || 'beginner' };
  }
  if (Array.isArray(m.events)) MS.events = merge ? MS.events.concat(m.events).sort((a, b) => a.t - b.t).slice(-500) : m.events.slice(-500);
  (m.dismissed || []).forEach(x => MS.dismissed.add(x));
  (m.dismissedSongs || []).forEach(x => MS.dismissedSongs.add(x));
  if (merge) saveMusic();
}
// Updates: every open loads the newest app (the service worker asks the internet first). If the app was left open in
// the background, coming back to it checks for a newer version, and the new version takes over by reloading the page
// (right away when she isn't in the middle of something, otherwise when she next leaves the app, or with Reload).
let updatePending = false;
function watchUpdates() {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !updatePending) appUpdated(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    let last = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && updatePending && !busyNow()) reloadApp();
      else if (document.visibilityState === 'visible' && Date.now() - last > 10 * 60e3) { last = Date.now(); reg.update().catch(() => {}); }
    });
  }).catch(() => {});
}
function busyNow() {
  const a = document.activeElement;
  return !$('#sheetwrap').hidden || (S.route.v === 'video' && !!YTP) || !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value);
}
function reloadApp() {
  const v = S.route.v, go = v === 'music' || v === 'video' ? 'music' : v === 'ideas' ? 'ideas' : '';
  location.replace(location.pathname + (go ? '?go=' + go : ''));
}
function appUpdated() {
  updatePending = true;
  if (!busyNow()) reloadApp();
  else toast('Artistry has an update', 'Reload', reloadApp);
}
async function init() {
  const qs = new URLSearchParams(location.search);
  const shared = { url: qs.get('url') || '', text: qs.get('text') || '', title: qs.get('title') || '' };
  const start = qs.get('go') === 'ideas' ? { v: 'ideas' } : qs.get('go') === 'music' ? { v: 'music' } : { v: 'home' };
  history.replaceState(start, '', location.pathname);
  S.route = start;
  renderRoute();
  const ok = await DB.open();
  const [pins, taste, dismissed, music, owner] = await Promise.all([DB.all('pins').catch(() => []), kvGet('taste').catch(() => null), kvGet('dismissed').catch(() => null), kvGet('music').catch(() => null), kvGet('owner').catch(() => null)]);
  S.owner = owner === true;
  if (music) loadMusicState(music);
  S.pins = (pins || []).sort((a, b) => b.createdAt - a.createdAt);
  if (taste) S.taste = Object.assign({ avoidTags: {}, avoidCats: {}, views: {} }, taste);
  if (Array.isArray(dismissed)) S.dismissed = new Set(dismissed);
  S.ready = true;
  renderRoute();
  if (!ok) toast('This browser won’t let the app save. Ideas will be lost when you close it.');
  if (qs.get('me') === 'dave') setOwner(true);
  else if (qs.get('me') === 'off') setOwner(false);
  if (findUrl(shared.url) || findUrl(shared.text) || findUrl(shared.title) || shared.text) openSave(shared);
  else if (qs.has('add')) openSave({});
  if ('serviceWorker' in navigator && location.protocol === 'https:') watchUpdates();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
init();
})();
</script>
